# Example: Monorepo / Subdirectory Project (Turborepo, Nx, pnpm workspaces, etc.)
# Place this in your project repository at: .github/workflows/ci-cd-web.yml

name: Deploy Web App (Monorepo)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/web/**'
      - 'packages/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/web/**'
      - 'packages/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    # Replace 'my-org/shared-ci-cd' with your actual shared repository name
    uses: my-org/shared-ci-cd/.github/workflows/deploy-app.yml@v1
    with:
      # Monorepo Subdirectory
      working_directory: 'apps/web'

      # Package manager and output directory auto-detection handles the rest:
      # - Auto-detects pnpm/bun/yarn/npm from root or app lockfiles
      # - Auto-detects output directory (dist, out, build, .output/public)
      node_version: '22'
      package_manager: 'auto'
      build_command: 'npm run build'

      # Target Platforms
      enable_cloudflare: true
      cloudflare_project_name: 'monorepo-web-app'
      enable_vercel: false

      # Audits & Feedback
      enable_pr_comment: true
      enable_lighthouse: true
      lighthouse_routes: |
        /
        /docs

    secrets: inherit
