# Example: Standard Project deploying ONLY to Cloudflare Workers
# Place this in your project repository at: .github/workflows/ci-cd.yml

name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    # Replace 'my-org/shared-ci-cd' with your actual repository name
    uses: my-org/shared-ci-cd/.github/workflows/deploy-app.yml@v2
    with:
      # Runtime & Build
      node_version: '22'
      package_manager: 'auto' # Auto-detects npm, pnpm, bun, yarn, or none
      build_command: 'npm run build'
      check_command: 'npx astro check' # or 'npm run lint'
      dist_dir: 'auto' # Auto-detects dist, out, build, .output/public, etc.

      # Target Platforms
      enable_cloudflare: true
      cloudflare_project_name: 'my-web-project'
      cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }} # optional; falls back to the secret
      enable_vercel: false # Vercel is disabled and consumes 0 runner seconds
      enable_previews: true # Set false to deploy production_branch only

      # Audits & Feedback
      enable_pr_comment: true
      enable_lighthouse: true
      lighthouse_routes: |
        /
        /about
        /contact

    # Build-time config: any inherited secret or repository/organization variable
    # named PUBLIC_* is exported into the build environment (variables win), e.g.
    # PUBLIC_GOOGLE_SHEET_SCRIPT_URL for Astro.
    secrets: inherit
