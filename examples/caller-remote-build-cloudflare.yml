# Example: Project delegating builds to Workers Builds via Deploy Hook
# Place this in your project repository at: .github/workflows/ci-cd.yml
#
# Workers Builds needs a committed wrangler.json in this repository (build
# command and assets directory). The deployment URL is resolved from
# CLOUDFLARE_ACCOUNT_ID plus a token; without them deploy_url is reported empty.

name: CI/CD Pipeline (Remote Cloudflare Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    # Replace 'my-org/shared-ci-cd' with your actual shared repository name
    uses: my-org/shared-ci-cd/.github/workflows/deploy-app.yml@v2
    with:
      # Build Strategy: Trigger a Workers Builds deploy hook
      # Skips the GitHub Actions build job to save private repository runner minutes
      build_location: 'cloudflare'

      # Target Platforms
      enable_cloudflare: true
      cloudflare_project_name: 'my-cf-remote-app'
      enable_vercel: false

      # Audits & Feedback
      enable_pr_comment: true
      enable_lighthouse: true
      lighthouse_routes: |
        /
        /about

    secrets: inherit
