name: Release Tag Manager

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  update-major-tag:
    name: Update Floating Major Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move and push floating major tag
        env:
          RAW_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${RAW_TAG}"
          echo "Published release tag: ${TAG}"

          # Extract major version prefix (e.g. 'v1' from 'v1.2.3')
          MAJOR_VERSION=$(echo "${TAG}" | grep -oP '^v[0-9]+' || true)

          if [ -z "${MAJOR_VERSION}" ]; then
            echo "Tag '${TAG}' is not in semantic version format (e.g. v1.0.0). Skipping floating tag update."
            exit 0
          fi

          # A published older version must not drag every consumer backwards.
          CURRENT=$(git tag --list "${MAJOR_VERSION}.*" --sort=-v:refname | head -1)
          if [ -n "${CURRENT}" ]; then
            NEWEST=$(printf '%s\n%s\n' "${CURRENT}" "${TAG}" | sort -V | tail -1)
            if [ "${NEWEST}" != "${TAG}" ]; then
              echo "Tag '${TAG}' is not newer than '${CURRENT}'; leaving '${MAJOR_VERSION}' in place."
              exit 0
            fi
          fi

          echo "Updating floating major tag '${MAJOR_VERSION}' to point to '${TAG}'..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "${MAJOR_VERSION}" -m "Automated update of ${MAJOR_VERSION} to ${TAG}"
          git push origin "${MAJOR_VERSION}" --force
          echo "Successfully updated and pushed floating tag '${MAJOR_VERSION}'."
