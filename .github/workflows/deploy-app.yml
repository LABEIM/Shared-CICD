name: Deploy Web Application

on:
  workflow_call:
    inputs:
      # Runtime & Build Settings
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '22'
      package_manager:
        description: 'Package manager (npm, pnpm, bun, yarn)'
        required: false
        type: string
        default: 'npm'
      install_command:
        description: 'Custom dependency installation command'
        required: false
        type: string
        default: ''
      check_command:
        description: 'Optional lint or diagnostic check command (e.g. "npx astro check")'
        required: false
        type: string
        default: ''
      build_command:
        description: 'Build command to generate static files'
        required: false
        type: string
        default: 'npm run build'
      dist_dir:
        description: 'Directory containing built static files'
        required: false
        type: string
        default: 'dist'

      # Cloudflare Target
      enable_cloudflare:
        description: 'Enable Cloudflare Pages deployment'
        required: false
        type: boolean
        default: true
      cloudflare_project_name:
        description: 'Cloudflare Pages project name'
        required: false
        type: string
        default: ''
      production_branch:
        description: 'Production branch name'
        required: false
        type: string
        default: 'main'

      # Vercel Target
      enable_vercel:
        description: 'Enable Vercel deployment (Backup or Parallel)'
        required: false
        type: boolean
        default: false
      vercel_project_id:
        description: 'Vercel Project ID'
        required: false
        type: string
        default: ''
      vercel_org_id:
        description: 'Vercel Organization ID or Team ID'
        required: false
        type: string
        default: ''

      # PR Comment & Lighthouse Options
      enable_pr_comment:
        description: 'Post or update PR preview comments'
        required: false
        type: boolean
        default: true
      enable_lighthouse:
        description: 'Run Lighthouse CI performance audits'
        required: false
        type: boolean
        default: true
      lighthouse_routes:
        description: 'Space or newline-separated relative routes to audit (e.g. "/ /about /contact")'
        required: false
        type: string
        default: '/'
      lighthouse_config_path:
        description: 'Optional path to custom Lighthouse CI config file'
        required: false
        type: string
        default: ''

    secrets:
      CLOUDFLARE_API_TOKEN:
        description: 'Cloudflare API Token'
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Cloudflare Account ID'
        required: false
      VERCEL_TOKEN:
        description: 'Vercel Authentication Token'
        required: false

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Stage 1: Build & Validate
  # ──────────────────────────────────────────────────────────────────────
  validate-and-build:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm (if requested)
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Bun (if requested)
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ (inputs.package_manager == 'npm' || inputs.package_manager == 'pnpm' || inputs.package_manager == 'yarn') && inputs.package_manager || '' }}

      - name: Install dependencies
        run: |
          if [ -n "${{ inputs.install_command }}" ]; then
            echo "Running custom install command..."
            ${{ inputs.install_command }}
          else
            case "${{ inputs.package_manager }}" in
              pnpm)
                pnpm install --frozen-lockfile
                ;;
              bun)
                bun install --frozen-lockfile
                ;;
              yarn)
                yarn install --frozen-lockfile
                ;;
              *)
                if [ -f "package-lock.json" ]; then
                  npm ci
                else
                  npm install
                fi
                ;;
            esac
          fi

      - name: Run Diagnostics / Checks
        if: inputs.check_command != ''
        run: |
          echo "Running check command: ${{ inputs.check_command }}"
          ${{ inputs.check_command }}

      - name: Build static site export
        id: build
        run: |
          BUILD_START=$(date +%s)
          echo "Running build command: ${{ inputs.build_command }}"
          ${{ inputs.build_command }}
          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))
          echo "duration=${BUILD_DURATION}s" >> "$GITHUB_OUTPUT"

      - name: Generate build artifact hash
        id: hash
        run: |
          TARGET_DIR="${{ inputs.dist_dir }}"
          if [ -d "$TARGET_DIR" ]; then
            HASH=$(find "$TARGET_DIR" -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
            echo "sha256=${HASH}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Output directory '$TARGET_DIR' not found."
            echo "sha256=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload dist build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-static-build
          path: ${{ inputs.dist_dir }}/
          retention-days: 3

      - name: Build summary
        run: |
          TARGET_DIR="${{ inputs.dist_dir }}"
          DIR_SIZE="N/A"
          if [ -d "$TARGET_DIR" ]; then
            DIR_SIZE=$(du -sh "$TARGET_DIR" | cut -f1)
          fi
          HASH="${{ steps.hash.outputs.sha256 }}"

          echo "### Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Duration | ${{ steps.build.outputs.duration }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact SHA256 | \`${HASH:0:16}...\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact Size | ${DIR_SIZE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────
  # Stage 2a: Deploy to Cloudflare Pages (Primary / Optional)
  # ──────────────────────────────────────────────────────────────────────
  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    needs: validate-and-build
    if: inputs.enable_cloudflare == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'cloudflare-preview' || 'cloudflare-production' }}
      url: ${{ steps.deploy_cf.outputs.deploy_url }}
    outputs:
      deploy_url: ${{ steps.deploy_cf.outputs.deploy_url }}
    steps:
      - name: Download dist build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: ${{ inputs.dist_dir }}/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Deploy to Cloudflare Pages via Wrangler
        id: deploy_cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ inputs.cloudflare_project_name }}
          DIST_DIR: ${{ inputs.dist_dir }}
          PROD_BRANCH: ${{ inputs.production_branch }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets must be provided."
            exit 1
          fi

          RAW_HEAD_REF="${{ github.head_ref }}"
          RAW_REF_NAME="${{ github.ref_name }}"
          BRANCH_NAME="${RAW_HEAD_REF:-$RAW_REF_NAME}"

          # Auto-create Pages project shell if it does not exist yet
          npx wrangler pages project create "$PROJECT_NAME" --production-branch="$PROD_BRANCH" > /dev/null 2>&1 || true

          # Deploy with retry logic (3 attempts, exponential backoff)
          MAX_RETRIES=3
          RETRY_DELAY=10
          for ATTEMPT in $(seq 1 $MAX_RETRIES); do
            echo "::group::Cloudflare deployment attempt $ATTEMPT/$MAX_RETRIES"
            if npx wrangler pages deploy "$DIST_DIR" \
              --project-name="$PROJECT_NAME" \
              --branch="$BRANCH_NAME" \
              --commit-dirty=true 2>&1 | tee deploy.log; then
              echo "::endgroup::"
              echo "Deployment succeeded on attempt $ATTEMPT"
              break
            fi
            echo "::endgroup::"
            if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
              echo "Attempt $ATTEMPT failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            else
              echo "::error::All $MAX_RETRIES deployment attempts to Cloudflare Pages failed."
              exit 1
            fi
          done

          CLEAN_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/^-//; s/-$//')
          PROD_URL=$(grep -i "Production URL:" deploy.log | grep -oP 'https://[a-zA-Z0-9.-]+\.pages\.dev' | head -1 | tr -cd 'a-zA-Z0-9.:/_-' || true)
          BRANCH_PREVIEW_URL=$(grep -i "Branch Preview URL:" deploy.log | grep -oP 'https://[a-zA-Z0-9.-]+\.pages\.dev' | head -1 | tr -cd 'a-zA-Z0-9.:/_-' || true)

          DEPLOY_URL=""
          if [ "$CLEAN_BRANCH" = "$PROD_BRANCH" ] || [ "$CLEAN_BRANCH" = "main" ] || [ "$CLEAN_BRANCH" = "master" ]; then
            if [ -n "$PROD_URL" ]; then
              DEPLOY_URL="$PROD_URL"
            else
              DEPLOY_URL="https://${PROJECT_NAME}.pages.dev"
            fi
          else
            if [ -n "$BRANCH_PREVIEW_URL" ]; then
              DEPLOY_URL="$BRANCH_PREVIEW_URL"
            fi
          fi

          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL=$(sed 's/\x1B\[[0-9;]*[a-zA-Z]//g' deploy.log \
              | grep -oP 'https://[a-zA-Z0-9.-]+\.(pages\.dev|workers\.dev)' \
              | grep -iv 'dash\.cloudflare\|api\.cloudflare' \
              | head -1 \
              | tr -cd 'a-zA-Z0-9.:/_-' || true)
          fi

          if [ -z "$DEPLOY_URL" ] || ! echo "$DEPLOY_URL" | grep -q '^https://'; then
            if [ "$CLEAN_BRANCH" = "$PROD_BRANCH" ] || [ "$CLEAN_BRANCH" = "main" ]; then
              DEPLOY_URL="https://${PROJECT_NAME}.pages.dev"
            else
              DEPLOY_URL="https://${CLEAN_BRANCH}.${PROJECT_NAME}.pages.dev"
            fi
          fi

          echo "Captured Cloudflare deployment URL: $DEPLOY_URL"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "$DEPLOY_URL" > cf_deploy_url.txt

      - name: Upload CF deploy URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf-deploy-url
          path: cf_deploy_url.txt
          retention-days: 1

      - name: Deployment summary
        run: |
          echo "### Cloudflare Pages Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ steps.deploy_cf.outputs.deploy_url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.head_ref || github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | Deployed |" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────
  # Stage 2b: Deploy to Vercel (Parallel / Optional)
  # ──────────────────────────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel
    needs: validate-and-build
    if: inputs.enable_vercel == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'vercel-preview' || 'vercel-production' }}
      url: ${{ steps.resolve_url.outputs.deploy_url }}
    outputs:
      deploy_url: ${{ steps.resolve_url.outputs.deploy_url }}
    env:
      VERCEL_ORG_ID: ${{ inputs.vercel_org_id }}
      VERCEL_PROJECT_ID: ${{ inputs.vercel_project_id }}
    steps:
      - name: Download dist build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: ${{ inputs.dist_dir }}/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: |
          ENV_ARG="preview"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            ENV_ARG="production"
          fi
          vercel pull --yes --environment="$ENV_ARG" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel Output API structure
        run: |
          DIST="${{ inputs.dist_dir }}"
          mkdir -p .vercel/output/static
          cp -r "${DIST}"/. .vercel/output/static/
          printf '{"version":3}\n' > .vercel/output/config.json
          echo "Vercel Output API structure ready:"
          ls -la .vercel/output/

      - name: Deploy to Vercel (with retry)
        id: deploy
        run: |
          PROD_FLAG=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            PROD_FLAG="--prod"
          fi

          MAX_RETRIES=3
          RETRY_DELAY=10
          DEPLOY_EXIT=1
          for ATTEMPT in $(seq 1 $MAX_RETRIES); do
            echo "::group::Vercel deployment attempt $ATTEMPT/$MAX_RETRIES"
            vercel deploy --prebuilt $PROD_FLAG --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1
            DEPLOY_EXIT=$?
            echo "::endgroup::"
            if [ "$DEPLOY_EXIT" -eq 0 ]; then
              echo "Deployment succeeded on attempt $ATTEMPT"
              break
            fi
            if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
              echo "Attempt $ATTEMPT failed (exit $DEPLOY_EXIT), retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            else
              echo "::error::All $MAX_RETRIES deployment attempts to Vercel failed."
              exit 1
            fi
          done

      - name: Resolve Vercel deployment URL via REST API
        id: resolve_url
        run: |
          echo "Querying Vercel API for latest deployment URL..."
          API_RESPONSE=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=1" \
            || echo "")

          if command -v jq &>/dev/null; then
            DEPLOY_HOST=$(echo "$API_RESPONSE" | jq -r '.deployments[0].url // empty' 2>/dev/null)
          else
            DEPLOY_HOST=$(echo "$API_RESPONSE" \
              | grep -oP '"url"\s*:\s*"\K[^"]+' \
              | head -1)
          fi

          if [ -n "$DEPLOY_HOST" ]; then
            case "$DEPLOY_HOST" in
              https://*) DEPLOY_URL="$DEPLOY_HOST" ;;
              *)         DEPLOY_URL="https://${DEPLOY_HOST}" ;;
            esac
            echo "Resolved Vercel deployment URL: $DEPLOY_URL"
          else
            echo "::warning::Could not resolve Vercel deployment URL via REST API."
            DEPLOY_URL=""
          fi

          echo "$DEPLOY_URL" > vercel_deploy_url.txt
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Upload Vercel deploy URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deploy-url
          path: vercel_deploy_url.txt
          retention-days: 1

      - name: Deployment summary
        run: |
          echo "### Vercel Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ steps.resolve_url.outputs.deploy_url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.head_ref || github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | Deployed |" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────
  # Stage 3: Post PR Preview Comment (Optional)
  # ──────────────────────────────────────────────────────────────────────
  comment-pr:
    name: Post PR Preview Comment
    needs: [deploy-cloudflare, deploy-vercel]
    if: >-
      inputs.enable_pr_comment == true &&
      github.event_name == 'pull_request' &&
      (needs.deploy-cloudflare.result == 'success' || needs.deploy-vercel.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download CF deploy URL artifact
        uses: actions/download-artifact@v4
        with:
          name: cf-deploy-url
          path: .
        continue-on-error: true

      - name: Download Vercel deploy URL artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-deploy-url
          path: .
        continue-on-error: true

      - name: Build comment body
        id: build_body
        env:
          CF_URL: ${{ needs.deploy-cloudflare.outputs.deploy_url }}
          VERCEL_URL: ${{ needs.deploy-vercel.outputs.deploy_url }}
        run: |
          CF_CLEAN=$(echo "$CF_URL" | tr -cd 'a-zA-Z0-9.:/_-')
          if [ -z "$CF_CLEAN" ] && [ -f cf_deploy_url.txt ]; then
            CF_CLEAN=$(cat cf_deploy_url.txt | tr -cd 'a-zA-Z0-9.:/_-')
          fi

          VERCEL_CLEAN=$(echo "$VERCEL_URL" | tr -cd 'a-zA-Z0-9.:/_-')
          if [ -z "$VERCEL_CLEAN" ] && [ -f vercel_deploy_url.txt ]; then
            VERCEL_CLEAN=$(cat vercel_deploy_url.txt | tr -cd 'a-zA-Z0-9.:/_-')
          fi

          {
            echo "body<<COMMENT_EOF"
            echo "### Preview Deployments Ready"
            echo ""
            echo "| Platform | Preview URL | Status |"
            echo "| :--- | :--- | :---: |"
            if [ -n "$CF_CLEAN" ]; then
              echo "| **Cloudflare Pages** | [$CF_CLEAN]($CF_CLEAN) | Live |"
            fi
            if [ -n "$VERCEL_CLEAN" ]; then
              echo "| **Vercel** | [$VERCEL_CLEAN]($VERCEL_CLEAN) | Live |"
            fi
            echo ""
            echo "---"
            echo "*Commit: \`${{ github.event.pull_request.head.sha || github.sha }}\` · Workflow: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
            echo "COMMENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find existing preview comment
        uses: peter-evans/find-comment@v4
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Preview Deployments Ready'

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.build_body.outputs.body }}
          edit-mode: replace

  # ──────────────────────────────────────────────────────────────────────
  # Stage 4: Lighthouse Performance Audit (Optional)
  # ──────────────────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse Audit
    needs: [validate-and-build, deploy-cloudflare, deploy-vercel]
    if: >-
      always() &&
      inputs.enable_lighthouse == true &&
      needs.validate-and-build.result == 'success' &&
      (needs.deploy-cloudflare.result == 'success' || needs.deploy-vercel.result == 'success' || (inputs.enable_cloudflare == false && inputs.enable_vercel == false))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dist build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: ${{ inputs.dist_dir }}/

      - name: Download CF deploy URL artifact
        uses: actions/download-artifact@v4
        with:
          name: cf-deploy-url
          path: .
        continue-on-error: true

      - name: Download Vercel deploy URL artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-deploy-url
          path: .
        continue-on-error: true

      - name: Resolve target URL for Lighthouse
        id: target_url
        env:
          CF_NEEDS_URL: ${{ needs.deploy-cloudflare.outputs.deploy_url }}
          VERCEL_NEEDS_URL: ${{ needs.deploy-vercel.outputs.deploy_url }}
        run: |
          TARGET=""
          if [ -n "$CF_NEEDS_URL" ]; then
            TARGET=$(echo "$CF_NEEDS_URL" | tr -cd 'a-zA-Z0-9.:/_-')
          elif [ -n "$VERCEL_NEEDS_URL" ]; then
            TARGET=$(echo "$VERCEL_NEEDS_URL" | tr -cd 'a-zA-Z0-9.:/_-')
          fi

          if [ -z "$TARGET" ] && [ -f cf_deploy_url.txt ]; then
            TARGET=$(cat cf_deploy_url.txt | tr -cd 'a-zA-Z0-9.:/_-')
          fi
          if [ -z "$TARGET" ] && [ -f vercel_deploy_url.txt ]; then
            TARGET=$(cat vercel_deploy_url.txt | tr -cd 'a-zA-Z0-9.:/_-')
          fi

          echo "Resolved target URL: '${TARGET:-(static fallback)}'"
          echo "url=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Build Lighthouse URL list
        if: steps.target_url.outputs.url != ''
        id: build_url_list
        env:
          BASE_URL: ${{ steps.target_url.outputs.url }}
          ROUTES: ${{ inputs.lighthouse_routes }}
        run: |
          BASE=$(echo "$BASE_URL" | sed 's|/$||')
          {
            echo "urls<<EOF_URLS"
            for ROUTE in $ROUTES; do
              CLEAN_ROUTE=$(echo "$ROUTE" | sed 's|^/||')
              if [ -z "$CLEAN_ROUTE" ]; then
                echo "${BASE}/"
              else
                echo "${BASE}/${CLEAN_ROUTE}"
              fi
            done
            echo "EOF_URLS"
          } >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse audit (Live URL)
        if: steps.target_url.outputs.url != ''
        id: lighthouse_live
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ${{ inputs.lighthouse_config_path }}
          urls: ${{ steps.build_url_list.outputs.urls }}
          uploadArtifacts: true

      - name: Run Lighthouse audit (Static Fallback)
        if: steps.target_url.outputs.url == ''
        id: lighthouse_static
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ${{ inputs.lighthouse_config_path }}
          uploadArtifacts: true

      - name: Format and record Lighthouse summary
        if: always()
        id: parse_lh
        env:
          TARGET_URL: ${{ steps.target_url.outputs.url }}
          LIVE_MANIFEST: ${{ steps.lighthouse_live.outputs.manifest }}
          STATIC_MANIFEST: ${{ steps.lighthouse_static.outputs.manifest }}
          LIVE_LINKS: ${{ steps.lighthouse_live.outputs.links }}
          STATIC_LINKS: ${{ steps.lighthouse_static.outputs.links }}
        run: |
          node -e '
            const fs = require("fs");
            const targetUrl = process.env.TARGET_URL || "static dist/";
            const liveManifestStr = process.env.LIVE_MANIFEST || "";
            const staticManifestStr = process.env.STATIC_MANIFEST || "";
            const liveLinksStr = process.env.LIVE_LINKS || "";
            const staticLinksStr = process.env.STATIC_LINKS || "";
            const summaryFile = process.env.GITHUB_STEP_SUMMARY;
            const outputFile = process.env.GITHUB_OUTPUT;

            let manifest = null;
            let links = {};

            try {
              const rawManifest = liveManifestStr || staticManifestStr;
              if (rawManifest) manifest = JSON.parse(rawManifest);
            } catch (e) {}

            if (!manifest && fs.existsSync(".lighthouseci/manifest.json")) {
              try {
                manifest = JSON.parse(fs.readFileSync(".lighthouseci/manifest.json", "utf8"));
              } catch (e) {}
            }

            try {
              const rawLinks = liveLinksStr || staticLinksStr;
              if (rawLinks) links = JSON.parse(rawLinks);
            } catch (e) {}

            if (Object.keys(links).length === 0 && fs.existsSync(".lighthouseci/links.json")) {
              try {
                links = JSON.parse(fs.readFileSync(".lighthouseci/links.json", "utf8"));
              } catch (e) {}
            }

            let md = "### Lighthouse Audit Results\n\n";
            md += `**Target URL:** \`${targetUrl}\`\n\n`;

            if (manifest && Array.isArray(manifest) && manifest.length > 0) {
              const representativeRuns = manifest.filter(r => r.isRepresentativeRun);
              const runsToDisplay = representativeRuns.length > 0 ? representativeRuns : [manifest[0]];

              runsToDisplay.forEach((run, idx) => {
                const summary = run.summary || {};
                const reportUrl = links[run.url] || links[Object.keys(links)[idx]] || null;

                const getStatus = (score) => {
                  if (score === undefined || score === null) return { pct: "N/A", status: "N/A" };
                  const pct = Math.round(score * 100);
                  if (pct >= 90) return { pct: `${pct}%`, status: "Pass" };
                  if (pct >= 50) return { pct: `${pct}%`, status: "Average" };
                  return { pct: `${pct}%`, status: "Fail" };
                };

                const perf = getStatus(summary.performance);
                const a11y = getStatus(summary.accessibility);
                const bp = getStatus(summary["best-practices"]);
                const seo = getStatus(summary.seo);

                const pageLabel = run.url
                  ? (() => {
                      try {
                        const u = new URL(run.url);
                        const path = u.pathname === "/" ? "(Home)" : u.pathname;
                        return `**Path: \`${path}\`**`;
                      } catch (e) {
                        return `**URL: \`${run.url}\`**`;
                      }
                    })()
                  : `**Run ${idx + 1}**`;
                md += `${pageLabel}\n\n`;

                md += "| Category | Score | Status |\n";
                md += "| :--- | :---: | :--- |\n";
                md += `| Performance | **${perf.pct}** | ${perf.status} |\n`;
                md += `| Accessibility | **${a11y.pct}** | ${a11y.status} |\n`;
                md += `| Best Practices | **${bp.pct}** | ${bp.status} |\n`;
                md += `| SEO | **${seo.pct}** | ${seo.status} |\n\n`;

                if (reportUrl) {
                  md += `[View Interactive Lighthouse Report](${reportUrl})\n\n`;
                }
              });
              md += "*Full reports saved in workflow artifacts (`lhci-artifacts`).*\n";
            } else {
              md += "Note: *No Lighthouse audit manifest could be read. Check workflow artifacts for details.*\n";
            }

            if (summaryFile) {
              fs.appendFileSync(summaryFile, md);
            }

            if (outputFile) {
              const eof = "EOF_" + Math.random().toString(36).substring(2);
              fs.appendFileSync(outputFile, `comment_body<<${eof}\n${md}\n${eof}\n`);
            }
          '

      - name: Find existing PR comment
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v4
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Preview Deployments Ready'

      - name: Append Lighthouse results to PR comment
        if: always() && github.event_name == 'pull_request' && steps.find_comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          body: |
            
            ---
            ${{ steps.parse_lh.outputs.comment_body }}
          edit-mode: append
