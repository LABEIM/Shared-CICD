name: Deploy Web Application

on:
  workflow_call:
    inputs:
      # Monorepo & Working Directory
      working_directory:
        description: 'Working directory for projects in monorepos or subdirectories'
        required: false
        type: string
        default: '.'

      # Build Location & Strategy
      build_location:
        description: 'Where to build the application ("github", "vercel", "cloudflare", "none")'
        required: false
        type: string
        default: 'github'

      # Preview Deployments
      enable_previews:
        description: 'Deploy preview environments for non-production refs'
        required: false
        type: boolean
        default: true

      # Runtime & Build Settings (Used when build_location is "github")
      node_version:
        description: 'Node.js version (or "auto" for .nvmrc / .node-version)'
        required: false
        type: string
        default: '22'
      package_manager:
        description: 'Package manager ("auto", "npm", "pnpm", "bun", "yarn", "none", "static")'
        required: false
        type: string
        default: 'auto'
      install_command:
        description: 'Custom dependency installation command (or "none" to skip)'
        required: false
        type: string
        default: ''
      check_command:
        description: 'Optional lint or diagnostic check command (e.g. "npx astro check")'
        required: false
        type: string
        default: ''
      build_command:
        description: 'Build command to generate static files (or "none" to skip, or "auto")'
        required: false
        type: string
        default: 'npm run build'
      dist_dir:
        description: 'Directory containing built static files (or "auto" to detect standard output folders)'
        required: false
        type: string
        default: 'dist'

      # Production target (Cloudflare and Vercel)
      production_branch:
        description: 'Branch that deploys to production on both Cloudflare and Vercel; other branches deploy previews'
        required: false
        type: string
        default: 'main'

      # Cloudflare Target
      enable_cloudflare:
        description: 'Enable Cloudflare Workers deployment'
        required: false
        type: boolean
        default: true
      cloudflare_project_name:
        description: 'Cloudflare Worker name (defaults to the repository name)'
        required: false
        type: string
        default: ''
      cloudflare_mode:
        description: 'Cloudflare deployment shape: "auto", "static", or "ssr"'
        required: false
        type: string
        default: 'auto'
      cloudflare_account_id:
        description: 'Cloudflare Account ID (non-secret option; falls back to CLOUDFLARE_ACCOUNT_ID)'
        required: false
        type: string
        default: ''

      # Vercel Target
      enable_vercel:
        description: 'Enable Vercel deployment (Backup or Parallel or Remote Builder)'
        required: false
        type: boolean
        default: false
      vercel_project_id:
        description: 'Vercel Project ID'
        required: false
        type: string
        default: ''
      vercel_org_id:
        description: 'Vercel Organization ID or Team ID'
        required: false
        type: string
        default: ''

      # PR Comment & Lighthouse Options
      enable_pr_comment:
        description: 'Post or update PR preview comments'
        required: false
        type: boolean
        default: true
      enable_lighthouse:
        description: 'Run Lighthouse CI performance audits'
        required: false
        type: boolean
        default: true
      lighthouse_routes:
        description: 'Space or newline-separated relative routes to audit (e.g. "/ /about /contact")'
        required: false
        type: string
        default: '/'
      lighthouse_config_path:
        description: 'Optional path to custom Lighthouse CI config file'
        required: false
        type: string
        default: ''

    secrets:
      CLOUDFLARE_API_TOKEN:
        description: 'Cloudflare API Token'
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Cloudflare Account ID'
        required: false
      CLOUDFLARE_DEPLOY_HOOK_URL:
        description: 'Workers Builds Deploy Hook URL for remote Cloudflare builds'
        required: false
      VERCEL_TOKEN:
        description: 'Vercel Authentication Token'
        required: false

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Stage 1: Build & Validate (GitHub Runner - Skipped if remote building)
  # ──────────────────────────────────────────────────────────────────────
  validate-and-build:
    name: Build & Validate
    if: inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_hash: ${{ steps.build.outputs.artifact_hash }}
      build_duration: ${{ steps.build.outputs.build_duration }}
      detected_dist_dir: ${{ steps.build.outputs.resolved_dist_dir }}
      is_bootstrap: ${{ steps.build.outputs.is_bootstrap }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Export PUBLIC_* values for build
        shell: bash
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
          ALL_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          DELIM="__GH_ENV_$(openssl rand -hex 16)__"

          # A name defined as both a secret and a non-empty variable with a different
          # value would silently change the build config, so fail instead of guessing.
          conflicts=$(printf '%s' "$ALL_SECRETS_JSON" \
            | jq -r --argjson v "$ALL_VARS_JSON" '
                [ to_entries[]
                  | select(.key | startswith("PUBLIC_"))
                  | select(.value != "" and $v[.key] != null and $v[.key] != "" and $v[.key] != .value)
                  | .key ] | .[]')
          if [ -n "$conflicts" ]; then
            echo "::error::PUBLIC_* defined as both a secret and a non-empty variable with different values: $(printf '%s' "$conflicts" | tr '\n' ' ')"
            exit 1
          fi

          # Only PUBLIC_* values are exported. Variables win over secrets; an empty variable does not.
          printf '%s' "$ALL_SECRETS_JSON" \
            | jq -r --argjson v "$ALL_VARS_JSON" --arg delim "$DELIM" '
                (. + ($v | with_entries(select(.value != ""))))
                | to_entries[]
                | select(.key | startswith("PUBLIC_"))
                | "\(.key)<<\($delim)\n\(.value)\n\($delim)"
              ' >> "$GITHUB_ENV"

          echo "Exported PUBLIC_* values to the build environment:"
          printf '%s' "$ALL_SECRETS_JSON" \
            | jq -r --argjson v "$ALL_VARS_JSON" '
                (. + ($v | with_entries(select(.value != ""))))
                | to_entries[] | select(.key | startswith("PUBLIC_")) | .key
              '

      # The reusable workflow runs in consumer repositories, where `./actions/*` resolves
      # against the consumer's checkout. Reference this repository's actions explicitly and
      # keep `@v2` in sync with the floating release tag. Fork owners must edit these five
      # refs; `uses:` cannot take an input, so the workflow cannot re-point itself.
      - name: Setup, build, and upload static app
        id: build
        uses: LABEIM/shared-ci-cd/actions/setup-and-build@v2
        with:
          working_directory: ${{ inputs.working_directory }}
          project_name: ${{ inputs.cloudflare_project_name }}
          node_version: ${{ inputs.node_version }}
          package_manager: ${{ inputs.package_manager }}
          install_command: ${{ inputs.install_command }}
          check_command: ${{ inputs.check_command }}
          build_command: ${{ inputs.build_command }}
          dist_dir: ${{ inputs.dist_dir }}

  # ──────────────────────────────────────────────────────────────────────
  # Stage 2a: Deploy to Cloudflare Workers (Primary / Optional)
  # ──────────────────────────────────────────────────────────────────────
  deploy-cloudflare:
    name: Deploy to Cloudflare Workers
    needs: [validate-and-build]
    if: >-
      inputs.enable_cloudflare == true &&
      (inputs.enable_previews == true || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref_type == 'branch' && (github.head_ref || github.ref_name) == inputs.production_branch)) &&
      !cancelled() &&
      (needs.validate-and-build.result == 'success' || needs.validate-and-build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref_type == 'branch' && (github.head_ref || github.ref_name) == inputs.production_branch && 'cloudflare-production' || 'cloudflare-preview' }}
      url: ${{ steps.deploy_cf.outputs.deploy_url }}
    outputs:
      deploy_url: ${{ steps.deploy_cf.outputs.deploy_url }}
      deployment_mode: ${{ steps.deploy_cf.outputs.deployment_mode }}
      used_placeholder: ${{ steps.deploy_cf.outputs.used_placeholder }}
    steps:
      # A fork that only edits its caller's `uses:` still runs upstream's actions
      # with its own tokens. `job.workflow_repository` would detect that exactly,
      # but actionlint rejects it, so this notice is limited to non-LABEIM owners.
      - name: Note pipeline provenance
        if: github.repository_owner != 'LABEIM'
        shell: bash
        run: echo "::notice::This pipeline runs composite actions from LABEIM/shared-ci-cd@v2. A fork that keeps this workflow must copy deploy-app.yml into the fork, call it by local path, and re-point the LABEIM/shared-ci-cd/actions/* refs; otherwise its tokens run upstream code."

      - name: Checkout repository (if skipping GitHub build)
        if: inputs.build_location != 'github' && inputs.build_location != '' && inputs.build_location != 'auto'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download dist build artifact (if built on GitHub)
        if: inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto'
        uses: actions/download-artifact@v8
        with:
          name: dist-static-build
          path: ${{ inputs.working_directory }}/_dist_assets/

      # Wrangler 4.160 requires Node >= 22.12; the deploy job does not build.
      - name: Setup Node for Wrangler
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Deploy to Cloudflare Workers
        id: deploy_cf
        uses: LABEIM/shared-ci-cd/actions/deploy-cloudflare@v2
        with:
          working_directory: ${{ inputs.working_directory }}
          project_name: ${{ inputs.cloudflare_project_name }}
          dist_dir: ${{ (inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto') && '_dist_assets' || inputs.dist_dir }}
          production_branch: ${{ inputs.production_branch }}
          cloudflare_mode: ${{ inputs.cloudflare_mode }}
          enable_previews: ${{ inputs.enable_previews }}
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account_id: ${{ inputs.cloudflare_account_id || secrets.CLOUDFLARE_ACCOUNT_ID }}
          deploy_hook_url: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}

  # ──────────────────────────────────────────────────────────────────────
  # Stage 2b: Deploy to Vercel (Parallel / Optional / Remote Builder)
  # ──────────────────────────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel
    needs: [validate-and-build]
    if: >-
      inputs.enable_vercel == true &&
      (inputs.enable_previews == true || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref_type == 'branch' && (github.head_ref || github.ref_name) == inputs.production_branch)) &&
      !cancelled() &&
      (needs.validate-and-build.result == 'success' || needs.validate-and-build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref_type == 'branch' && (github.head_ref || github.ref_name) == inputs.production_branch && 'vercel-production' || 'vercel-preview' }}
      url: ${{ steps.resolve_url.outputs.deploy_url }}
    outputs:
      deploy_url: ${{ steps.resolve_url.outputs.deploy_url }}
      used_placeholder: ${{ steps.resolve_url.outputs.used_placeholder }}
    steps:
      # Same reason as the Cloudflare job's provenance notice: a fork must edit
      # these five refs itself, and the precise check fails actionlint.
      - name: Note pipeline provenance
        if: github.repository_owner != 'LABEIM'
        shell: bash
        run: echo "::notice::This pipeline runs composite actions from LABEIM/shared-ci-cd@v2. A fork that keeps this workflow must copy deploy-app.yml into the fork, call it by local path, and re-point the LABEIM/shared-ci-cd/actions/* refs; otherwise its tokens run upstream code."

      - name: Checkout repository (for remote build / standalone deploy)
        if: inputs.build_location == 'vercel' || inputs.build_location == 'none' || inputs.build_location == 'skip'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download dist build artifact (for prebuilt GitHub build)
        if: inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto'
        uses: actions/download-artifact@v8
        with:
          name: dist-static-build
          path: ${{ inputs.working_directory }}/_dist_assets/

      - name: Deploy to Vercel
        id: resolve_url
        uses: LABEIM/shared-ci-cd/actions/deploy-vercel@v2
        with:
          working_directory: ${{ inputs.working_directory }}
          project_id: ${{ inputs.vercel_project_id }}
          org_id: ${{ inputs.vercel_org_id }}
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          enable_previews: ${{ inputs.enable_previews }}
          dist_dir: ${{ (inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto') && '_dist_assets' || inputs.dist_dir }}
          remote_build: ${{ inputs.build_location == 'vercel' }}
          prepare_output: ${{ inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto' }}
          production_branch: ${{ inputs.production_branch }}

  # ──────────────────────────────────────────────────────────────────────
  # Stage 3: Post PR Preview Comment (Optional)
  # ──────────────────────────────────────────────────────────────────────
  comment-pr:
    name: Post PR Preview Comment
    needs: [deploy-cloudflare, deploy-vercel]
    if: >-
      inputs.enable_pr_comment == true &&
      github.event_name == 'pull_request' &&
      !cancelled() &&
      (needs.deploy-cloudflare.result == 'success' || needs.deploy-vercel.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update PR preview comment
        uses: LABEIM/shared-ci-cd/actions/pr-preview-comment@v2
        with:
          cloudflare_url: ${{ needs.deploy-cloudflare.outputs.deploy_url }}
          vercel_url: ${{ needs.deploy-vercel.outputs.deploy_url }}

  # ──────────────────────────────────────────────────────────────────────
  # Stage 4: Lighthouse Performance Audit (Optional)
  # ──────────────────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse Audit
    needs: [validate-and-build, deploy-cloudflare, deploy-vercel]
    if: >-
      always() &&
      inputs.enable_lighthouse == true &&
      !cancelled() &&
      (needs.deploy-cloudflare.result == 'success' || needs.deploy-vercel.result == 'success' || (inputs.enable_cloudflare == false && inputs.enable_vercel == false && needs.validate-and-build.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download dist build artifact (if available)
        if: inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: dist-static-build
          path: ${{ inputs.working_directory }}/_dist_assets/

      - name: Refuse to audit a bootstrap placeholder
        if: >-
          needs.validate-and-build.outputs.is_bootstrap == 'true' ||
          needs.deploy-cloudflare.outputs.used_placeholder == 'true' ||
          needs.deploy-vercel.outputs.used_placeholder == 'true'
        shell: bash
        run: |
          echo "::error::A bootstrap placeholder was built or deployed; Lighthouse will not audit it. Fix dist_dir or build_command."
          exit 1

      - name: Report a missing live URL instead of a Lighthouse regression
        if: >-
          needs.deploy-cloudflare.outputs.deploy_url == '' &&
          (inputs.cloudflare_mode == 'ssr' || needs.deploy-cloudflare.outputs.deployment_mode == 'ssr')
        shell: bash
        env:
          DEPLOY_RESULT: ${{ needs.deploy-cloudflare.result }}
        run: |
          echo "::error title=Lighthouse audit skipped (no live URL)::Cloudflare deploy result: '${DEPLOY_RESULT}'. No live URL was resolved for the ssr build, so Lighthouse did not run; this is not a Lighthouse score failure."
          {
            echo "### Lighthouse audit skipped"
            echo ""
            echo "The \`ssr\` deployment did not resolve a live URL (Cloudflare job: \`${DEPLOY_RESULT}\`). Lighthouse was not run, so this job reports no score."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Run Lighthouse audit and report
        uses: LABEIM/shared-ci-cd/actions/lighthouse-audit@v2
        with:
          working_directory: ${{ inputs.working_directory }}
          # SSR must be audited on the Worker; a Vercel backup or static client build cannot replace it.
          target_url: ${{ needs.deploy-cloudflare.outputs.deploy_url || ((inputs.cloudflare_mode != 'ssr' && needs.deploy-cloudflare.outputs.deployment_mode != 'ssr') && needs.deploy-vercel.outputs.deploy_url) || '' }}
          require_live_url: ${{ inputs.cloudflare_mode == 'ssr' || needs.deploy-cloudflare.outputs.deployment_mode == 'ssr' }}
          routes: ${{ inputs.lighthouse_routes }}
          config_path: ${{ inputs.lighthouse_config_path }}
          dist_dir: ${{ (inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto') && '_dist_assets' || inputs.dist_dir }}
