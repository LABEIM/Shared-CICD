name: Deploy Web Application

on:
  workflow_call:
    inputs:
      # Monorepo & Working Directory
      working_directory:
        description: 'Working directory for projects in monorepos or subdirectories'
        required: false
        type: string
        default: '.'

      # Build Location & Strategy
      build_location:
        description: 'Where to build the application ("github", "vercel", "cloudflare", "none")'
        required: false
        type: string
        default: 'github'

      # Runtime & Build Settings (Used when build_location is "github")
      node_version:
        description: 'Node.js version (or "auto" for .nvmrc / .node-version)'
        required: false
        type: string
        default: '22'
      package_manager:
        description: 'Package manager ("auto", "npm", "pnpm", "bun", "yarn", "none", "static")'
        required: false
        type: string
        default: 'auto'
      install_command:
        description: 'Custom dependency installation command (or "none" to skip)'
        required: false
        type: string
        default: ''
      check_command:
        description: 'Optional lint or diagnostic check command (e.g. "npx astro check")'
        required: false
        type: string
        default: ''
      build_command:
        description: 'Build command to generate static files (or "none" to skip, or "auto")'
        required: false
        type: string
        default: 'npm run build'
      dist_dir:
        description: 'Directory containing built static files (or "auto" to detect standard output folders)'
        required: false
        type: string
        default: 'dist'

      # Cloudflare Target
      enable_cloudflare:
        description: 'Enable Cloudflare Pages deployment'
        required: false
        type: boolean
        default: true
      cloudflare_project_name:
        description: 'Cloudflare Pages project name'
        required: false
        type: string
        default: ''
      production_branch:
        description: 'Production branch name'
        required: false
        type: string
        default: 'main'

      # Vercel Target
      enable_vercel:
        description: 'Enable Vercel deployment (Backup or Parallel or Remote Builder)'
        required: false
        type: boolean
        default: false
      vercel_project_id:
        description: 'Vercel Project ID'
        required: false
        type: string
        default: ''
      vercel_org_id:
        description: 'Vercel Organization ID or Team ID'
        required: false
        type: string
        default: ''

      # PR Comment & Lighthouse Options
      enable_pr_comment:
        description: 'Post or update PR preview comments'
        required: false
        type: boolean
        default: true
      enable_lighthouse:
        description: 'Run Lighthouse CI performance audits'
        required: false
        type: boolean
        default: true
      lighthouse_routes:
        description: 'Space or newline-separated relative routes to audit (e.g. "/ /about /contact")'
        required: false
        type: string
        default: '/'
      lighthouse_config_path:
        description: 'Optional path to custom Lighthouse CI config file'
        required: false
        type: string
        default: ''

    secrets:
      CLOUDFLARE_API_TOKEN:
        description: 'Cloudflare API Token'
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Cloudflare Account ID'
        required: false
      CLOUDFLARE_DEPLOY_HOOK_URL:
        description: 'Cloudflare Pages Deploy Hook URL for remote Cloudflare builds'
        required: false
      VERCEL_TOKEN:
        description: 'Vercel Authentication Token'
        required: false

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Stage 1: Build & Validate (GitHub Runner - Skipped if remote building)
  # ──────────────────────────────────────────────────────────────────────
  validate-and-build:
    name: Build & Validate
    if: inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_hash: ${{ steps.hash.outputs.sha256 }}
      build_duration: ${{ steps.build.outputs.duration }}
      detected_dist_dir: ${{ steps.stage_dist.outputs.dist_dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect project environment & package manager
        id: detect
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          REQ_MGR="${{ inputs.package_manager }}"
          RESOLVED_MGR="npm"
          CACHE_TYPE=""
          LOCKFILE_PATH=""

          if [ "$REQ_MGR" = "none" ] || [ "$REQ_MGR" = "static" ]; then
            RESOLVED_MGR="none"
          elif [ "$REQ_MGR" != "auto" ] && [ -n "$REQ_MGR" ]; then
            RESOLVED_MGR="$REQ_MGR"
            case "$RESOLVED_MGR" in
              pnpm) CACHE_TYPE="pnpm"; LOCKFILE_PATH="${{ inputs.working_directory }}/pnpm-lock.yaml" ;;
              yarn) CACHE_TYPE="yarn"; LOCKFILE_PATH="${{ inputs.working_directory }}/yarn.lock" ;;
              bun)  CACHE_TYPE=""; LOCKFILE_PATH="${{ inputs.working_directory }}/bun.lockb" ;;
              *)    CACHE_TYPE="npm"; LOCKFILE_PATH="${{ inputs.working_directory }}/package-lock.json" ;;
            esac
          else
            # Auto-detection mode: inspect lockfiles and package.json
            if [ -f "pnpm-lock.yaml" ]; then
              RESOLVED_MGR="pnpm"
              CACHE_TYPE="pnpm"
              LOCKFILE_PATH="${{ inputs.working_directory }}/pnpm-lock.yaml"
            elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
              RESOLVED_MGR="bun"
              CACHE_TYPE=""
              LOCKFILE_PATH="${{ inputs.working_directory }}/bun.lockb"
            elif [ -f "yarn.lock" ]; then
              RESOLVED_MGR="yarn"
              CACHE_TYPE="yarn"
              LOCKFILE_PATH="${{ inputs.working_directory }}/yarn.lock"
            elif [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ]; then
              RESOLVED_MGR="npm"
              CACHE_TYPE="npm"
              LOCKFILE_PATH="${{ inputs.working_directory }}/package-lock.json"
            elif [ ! -f "package.json" ]; then
              RESOLVED_MGR="none"
            else
              RESOLVED_MGR="npm"
            fi
          fi

          {
            echo "package_manager=${RESOLVED_MGR}"
            echo "cache_type=${CACHE_TYPE}"
            echo "lockfile_path=${LOCKFILE_PATH}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved Package Manager: $RESOLVED_MGR"

      - name: Setup pnpm (if requested)
        if: steps.detect.outputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Bun (if requested)
        if: steps.detect.outputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        if: steps.detect.outputs.package_manager != 'none' && steps.detect.outputs.package_manager != 'static'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version != 'auto' && inputs.node_version || '' }}
          node-version-file: ${{ (inputs.node_version == 'auto' || inputs.node_version == '') && (hashFiles(format('{0}/.nvmrc', inputs.working_directory), format('{0}/.node-version', inputs.working_directory)) != '' && (hashFiles(format('{0}/.nvmrc', inputs.working_directory)) != '' && format('{0}/.nvmrc', inputs.working_directory) || format('{0}/.node-version', inputs.working_directory)) || '') || '' }}
          cache: ${{ steps.detect.outputs.cache_type }}
          cache-dependency-path: ${{ steps.detect.outputs.lockfile_path }}

      - name: Install dependencies
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          INSTALL_CMD="${{ inputs.install_command }}"
          PKG_MGR="${{ steps.detect.outputs.package_manager }}"

          if [ "$INSTALL_CMD" = "none" ] || [ "$INSTALL_CMD" = "false" ] || [ "$INSTALL_CMD" = "skip" ] || [ "$PKG_MGR" = "none" ] || [ "$PKG_MGR" = "static" ]; then
            echo "Dependency installation skipped explicitly or no package manager required."
          elif [ -n "$INSTALL_CMD" ]; then
            echo "Running custom install command: $INSTALL_CMD"
            eval "$INSTALL_CMD"
          elif [ ! -f "package.json" ]; then
            echo "No package.json detected. Zero-dependency static project identified — skipping dependency installation."
          else
            case "$PKG_MGR" in
              pnpm)
                echo "Installing dependencies with pnpm..."
                if [ -f "pnpm-lock.yaml" ]; then
                  pnpm install --frozen-lockfile
                else
                  pnpm install
                fi
                ;;
              bun)
                echo "Installing dependencies with bun..."
                if [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
                  bun install --frozen-lockfile
                else
                  bun install
                fi
                ;;
              yarn)
                echo "Installing dependencies with yarn..."
                if [ -f "yarn.lock" ]; then
                  yarn install --frozen-lockfile
                else
                  yarn install
                fi
                ;;
              *)
                echo "Installing dependencies with npm..."
                if [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ]; then
                  npm ci
                else
                  npm install
                fi
                ;;
            esac
          fi

      - name: Run Diagnostics / Checks
        if: inputs.check_command != ''
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          echo "Running check command: ${{ inputs.check_command }}"
          ${{ inputs.check_command }}

      - name: Build static site export
        id: build
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          BUILD_START=$(date +%s)
          BUILD_CMD="${{ inputs.build_command }}"
          PKG_MGR="${{ steps.detect.outputs.package_manager }}"

          if [ "$BUILD_CMD" = "none" ] || [ "$BUILD_CMD" = "false" ] || [ "$BUILD_CMD" = "skip" ] || [ -z "$BUILD_CMD" ]; then
            echo "Static project detected: build step skipped."
          elif [ "$BUILD_CMD" = "npm run build" ] || [ "$BUILD_CMD" = "auto" ]; then
            if [ ! -f "package.json" ]; then
              echo "No package.json detected with default build command. Skipping build step for static project."
            elif ! node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.build ? 0 : 1)" 2>/dev/null; then
              echo "No 'build' script found in package.json. Skipping build step."
            else
              case "$PKG_MGR" in
                pnpm) echo "Running build: pnpm run build"; pnpm run build ;;
                bun)  echo "Running build: bun run build"; bun run build ;;
                yarn) echo "Running build: yarn build"; yarn build ;;
                *)    echo "Running build: npm run build"; npm run build ;;
              esac
            fi
          else
            echo "Running custom build command: $BUILD_CMD"
            eval "$BUILD_CMD"
          fi

          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))
          echo "duration=${BUILD_DURATION}s" >> "$GITHUB_OUTPUT"

      - name: Stage & Resolve static output directory
        id: stage_dist
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          PROJECT_NAME: ${{ inputs.cloudflare_project_name }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          REQ_DIR="${{ inputs.dist_dir }}"
          FINAL_DIR="$REQ_DIR"

          if [ "$REQ_DIR" = "auto" ] || [ ! -d "$REQ_DIR" ] || [ -z "$(ls -A "$REQ_DIR" 2>/dev/null)" ]; then
            # Search for standard static framework output directories
            if [ -d "dist" ] && [ "$(ls -A dist 2>/dev/null)" ]; then
              FINAL_DIR="dist"
            elif [ -d "out" ] && [ "$(ls -A out 2>/dev/null)" ]; then
              FINAL_DIR="out"
            elif [ -d "build" ] && [ "$(ls -A build 2>/dev/null)" ]; then
              FINAL_DIR="build"
            elif [ -d ".output/public" ] && [ "$(ls -A .output/public 2>/dev/null)" ]; then
              FINAL_DIR=".output/public"
            elif [ -d "_site" ] && [ "$(ls -A _site 2>/dev/null)" ]; then
              FINAL_DIR="_site"
            elif [ -d "site" ] && [ "$(ls -A site 2>/dev/null)" ]; then
              FINAL_DIR="site"
            elif [ -d "public" ] && [ "$(ls -A public 2>/dev/null)" ]; then
              echo "Auto-staging static files from 'public/' into 'dist/'..."
              mkdir -p dist
              cp -r public/* dist/ 2>/dev/null || cp -r public/. dist/
              FINAL_DIR="dist"
            elif [ -f "index.html" ]; then
              echo "Auto-staging static root files into 'dist/'..."
              mkdir -p dist
              find . -maxdepth 1 ! -name '.' ! -name 'dist' ! -name '.git' ! -name '.github' ! -name '.vercel' ! -name 'node_modules' ! -name '.lighthouseci' -exec cp -r {} dist/ \;
              FINAL_DIR="dist"
            else
              FINAL_DIR="dist"
            fi
          fi

          # Bootstrap Fallback: If output directory does not exist, is empty, or lacks index.html
          IS_BOOTSTRAP="false"
          if [ ! -d "$FINAL_DIR" ] || [ -z "$(ls -A "$FINAL_DIR" 2>/dev/null)" ] || [ ! -f "$FINAL_DIR/index.html" ]; then
            echo "No deployable index.html or build artifacts found in '$FINAL_DIR'."
            echo "Generating automatic Lighthouse-compliant bootstrap fallback..."
            FINAL_DIR="dist"
            mkdir -p "$FINAL_DIR"

            DISP_PROJECT="${PROJECT_NAME:-${REPO_NAME#*/}}"
            DISP_BRANCH="${BRANCH_NAME:-main}"

            cat << HTML_EOF > "${FINAL_DIR}/index.html"
            <!DOCTYPE html>
            <html lang="en">
            <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${DISP_PROJECT} — Deployment Active</title>
            <meta name="description" content="This project is successfully connected to the LABEIM automated CI/CD pipeline and Cloudflare Pages. Deployment is active and ready for development.">
            <meta name="robots" content="index, follow">
            <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
            <style>
            *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            }
            :root {
            --bg: #090d16;
            --card-bg: #111a2e;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.12);
            --success-border: rgba(34, 197, 94, 0.3);
            }
            body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            background-image: 
            radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
            radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            line-height: 1.6;
            }
            .container {
            width: 100%;
            max-width: 640px;
            }
            .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 50px -10px var(--accent-glow);
            }
            .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.02em;
            }
            .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
            @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            }
            h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 50%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            }
            .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 28px;
            }
            .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
            }
            @media (max-width: 480px) {
            .info-grid { grid-template-columns: 1fr; }
            .card { padding: 24px 20px; }
            h1 { font-size: 24px; }
            }
            .info-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 16px;
            }
            .info-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
            }
            .info-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-all;
            }
            .steps-section {
            border-top: 1px solid var(--card-border);
            padding-top: 24px;
            }
            .steps-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            }
            .steps-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            }
            .steps-list li {
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            }
            .step-number {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
            }
            footer {
            margin-top: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            }
            </style>
            </head>
            <body>
            <main class="container">
            <div class="card">
            <div class="badge">
            <span class="badge-dot"></span>
            <span>Cloudflare Pages &middot; Deployment Active</span>
            </div>
            <h1>${DISP_PROJECT}</h1>
            <p class="subtitle">This repository is live and successfully connected to the LABEIM automated deployment pipeline. Once your frontend code is pushed, this placeholder will automatically update.</p>
                        <div class="info-grid">
            <div class="info-item">
            <div class="info-label">Repository</div>
            <div class="info-value">${REPO_NAME}</div>
            </div>
            <div class="info-item">
            <div class="info-label">Branch</div>
            <div class="info-value">${DISP_BRANCH}</div>
            </div>
            <div class="info-item">
            <div class="info-label">Target Platform</div>
            <div class="info-value">Cloudflare Pages</div>
            </div>
            <div class="info-item">
            <div class="info-label">Pipeline Status</div>
            <div class="info-value">Active &amp; Ready</div>
            </div>
            </div>
                        <div class="steps-section">
            <h2 class="steps-title">Next Steps</h2>
            <ul class="steps-list">
            <li>
            <span class="step-number">1</span>
            <span>Scaffold your frontend application (e.g. Vite, Next.js, Astro, React, or static HTML).</span>
            </li>
            <li>
            <span class="step-number">2</span>
            <span>Commit and push your files to GitHub.</span>
            </li>
            <li>
            <span class="step-number">3</span>
            <span>The pipeline will automatically build and deploy your live web application.</span>
            </li>
            </ul>
            </div>
            </div>
            <footer>
            <p>LABEIM Shared CI/CD Pipeline &middot; Cloudflare Pages Deployment</p>
            </footer>
            </main>
            </body>
            </html>
          HTML_EOF

            cp "${FINAL_DIR}/index.html" "${FINAL_DIR}/404.html"
            echo "/*    /index.html   200" > "${FINAL_DIR}/_redirects"
            cat << 'ROBOTS_EOF' > "${FINAL_DIR}/robots.txt"
            User-agent: *
            Allow: /
          ROBOTS_EOF

            IS_BOOTSTRAP="true"
            echo "Bootstrap fallback successfully created in '${FINAL_DIR}'."
          fi

          echo "Resolved output directory: $FINAL_DIR"
          echo "dist_dir=${FINAL_DIR}" >> "$GITHUB_OUTPUT"
          echo "is_bootstrap=${IS_BOOTSTRAP}" >> "$GITHUB_OUTPUT"

      - name: Generate build artifact hash
        id: hash
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          TARGET_DIR="${{ steps.stage_dist.outputs.dist_dir }}"
          if [ -d "$TARGET_DIR" ]; then
            if [ "$TARGET_DIR" = "." ] || [ "$TARGET_DIR" = "./" ]; then
              HASH=$(find . -type f ! -path '*/.git/*' ! -path '*/.github/*' ! -path '*/node_modules/*' ! -path '*/.vercel/*' ! -path '*/.lighthouseci/*' -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
            else
              HASH=$(find "$TARGET_DIR" -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
            fi
            echo "sha256=${HASH}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Output directory '$TARGET_DIR' not found."
            echo "sha256=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload dist build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-static-build
          path: ${{ inputs.working_directory == '.' && format('{0}/', steps.stage_dist.outputs.dist_dir) || format('{0}/{1}/', inputs.working_directory, steps.stage_dist.outputs.dist_dir) }}
          retention-days: 3

      - name: Build summary
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          IS_BOOTSTRAP: ${{ steps.stage_dist.outputs.is_bootstrap }}
        run: |
          TARGET_DIR="${{ steps.stage_dist.outputs.dist_dir }}"
          DIR_SIZE="N/A"
          if [ -d "$TARGET_DIR" ]; then
            DIR_SIZE=$(du -sh "$TARGET_DIR" | cut -f1)
          fi
          HASH="${{ steps.hash.outputs.sha256 }}"

          {
            echo "### Build Summary"
            echo ""
            echo "| Metric | Value |"
            echo "| :--- | :--- |"
            echo "| Package Manager | \`${{ steps.detect.outputs.package_manager }}\` |"
            echo "| Output Directory | \`${TARGET_DIR}\` |"
            if [ "$IS_BOOTSTRAP" = "true" ]; then
              echo "| Deployment Type | **Bootstrap Fallback (Initial Commit)** |"
            else
              echo "| Deployment Type | Application Static Build |"
            fi
            echo "| Build Duration | ${{ steps.build.outputs.duration }} |"
            echo "| Artifact SHA256 | \`${HASH:0:16}...\` |"
            echo "| Artifact Size | ${DIR_SIZE} |"
            echo "| Branch | \`${BRANCH_NAME}\` |"
            echo "| Commit | \`${COMMIT_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────
  # Stage 2a: Deploy to Cloudflare Pages (Primary / Optional)
  # ──────────────────────────────────────────────────────────────────────
  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    needs: [validate-and-build]
    if: >-
      inputs.enable_cloudflare == true &&
      !cancelled() &&
      (needs.validate-and-build.result == 'success' || needs.validate-and-build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'cloudflare-preview' || 'cloudflare-production' }}
      url: ${{ steps.deploy_cf.outputs.deploy_url }}
    outputs:
      deploy_url: ${{ steps.deploy_cf.outputs.deploy_url }}
    steps:
      - name: Checkout repository (if skipping GitHub build)
        if: inputs.build_location != 'github' && inputs.build_location != '' && inputs.build_location != 'auto'
        uses: actions/checkout@v4

      - name: Download dist build artifact (if built on GitHub)
        if: inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto'
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: _dist_assets/

      - name: Deploy to Cloudflare Pages
        id: deploy_cf
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
          PROJECT_NAME: ${{ inputs.cloudflare_project_name }}
          DIST_DIR: ${{ (inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto') && '_dist_assets' || (inputs.working_directory == '.' && inputs.dist_dir || format('{0}/{1}', inputs.working_directory, inputs.dist_dir)) }}
          PROD_BRANCH: ${{ inputs.production_branch }}
          BUILD_LOCATION: ${{ inputs.build_location }}
          RAW_HEAD_REF: ${{ github.head_ref }}
          RAW_REF_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          BRANCH_NAME="${RAW_HEAD_REF:-$RAW_REF_NAME}"
          CLEAN_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/^-//; s/-$//')
          IS_PROD="false"
          if [ "$BRANCH_NAME" = "$PROD_BRANCH" ] || [ "$CLEAN_BRANCH" = "main" ] || [ "$CLEAN_BRANCH" = "master" ]; then
            IS_PROD="true"
          fi

          RESOLVED_PROJECT="${PROJECT_NAME:-${REPO_NAME#*/}}"
          CLEAN_PROJECT=$(echo "$RESOLVED_PROJECT" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/^-//; s/-$//')

          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Triggering remote Cloudflare Pages build via Deploy Hook..."
            HOOK_RESP=$(curl -s -X POST -w "\n%{http_code}" "$DEPLOY_HOOK")
            HTTP_CODE=$(echo "$HOOK_RESP" | tail -n1)
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Cloudflare Deploy Hook triggered successfully (HTTP $HTTP_CODE)."
            else
              echo "::error::Failed to trigger Cloudflare Deploy Hook (HTTP $HTTP_CODE): $HOOK_RESP"
              exit 1
            fi

            if [ "$IS_PROD" = "true" ]; then
              DEPLOY_URL="https://${CLEAN_PROJECT}.pages.dev"
            else
              DEPLOY_URL="https://${CLEAN_BRANCH}.${CLEAN_PROJECT}.pages.dev"
            fi
          else
            if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
              echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets must be provided."
              exit 1
            fi

            # Auto-bootstrap fallback if DIST_DIR is missing, empty, or lacks index.html
            if [ ! -d "$DIST_DIR" ] || [ -z "$(ls -A "$DIST_DIR" 2>/dev/null)" ] || [ ! -f "$DIST_DIR/index.html" ]; then
              echo "No deployable HTML found in '$DIST_DIR'. Bootstrapping fallback placeholder..."
              mkdir -p "$DIST_DIR"

              cat << HTML_EOF > "${DIST_DIR}/index.html"
            <!DOCTYPE html>
            <html lang="en">
            <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${CLEAN_PROJECT} — Deployment Active</title>
            <meta name="description" content="This project is successfully connected to the LABEIM automated CI/CD pipeline and Cloudflare Pages. Deployment is active and ready for development.">
            <meta name="robots" content="index, follow">
            <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
            <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            :root {
            --bg: #090d16;
            --card-bg: #111a2e;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.12);
            --success-border: rgba(34, 197, 94, 0.3);
            }
            body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            background-image: 
            radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
            radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            line-height: 1.6;
            }
            .container { width: 100%; max-width: 640px; }
            .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 50px -10px var(--accent-glow);
            }
            .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.02em;
            }
            .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
            @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            }
            h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 50%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            }
            .subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 28px; }
            .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
            }
            @media (max-width: 480px) {
            .info-grid { grid-template-columns: 1fr; }
            .card { padding: 24px 20px; }
            h1 { font-size: 24px; }
            }
            .info-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 16px;
            }
            .info-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
            }
            .info-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-all;
            }
            .steps-section { border-top: 1px solid var(--card-border); padding-top: 24px; }
            .steps-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            }
            .steps-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
            .steps-list li {
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            }
            .step-number {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
            }
            footer { margin-top: 24px; text-align: center; color: var(--text-muted); font-size: 13px; }
            </style>
            </head>
            <body>
            <main class="container">
            <div class="card">
            <div class="badge">
            <span class="badge-dot"></span>
            <span>Cloudflare Pages &middot; Deployment Active</span>
            </div>
            <h1>${CLEAN_PROJECT}</h1>
            <p class="subtitle">This repository is live and successfully connected to the LABEIM automated deployment pipeline. Once your frontend code is pushed, this placeholder will automatically update.</p>
                        <div class="info-grid">
            <div class="info-item">
            <div class="info-label">Repository</div>
            <div class="info-value">${REPO_NAME}</div>
            </div>
            <div class="info-item">
            <div class="info-label">Branch</div>
            <div class="info-value">${BRANCH_NAME}</div>
            </div>
            <div class="info-item">
            <div class="info-label">Target Platform</div>
            <div class="info-value">Cloudflare Pages</div>
            </div>
            <div class="info-item">
            <div class="info-label">Pipeline Status</div>
            <div class="info-value">Active &amp; Ready</div>
            </div>
            </div>
                        <div class="steps-section">
            <h2 class="steps-title">Next Steps</h2>
            <ul class="steps-list">
            <li>
            <span class="step-number">1</span>
            <span>Scaffold your frontend application (e.g. Vite, Next.js, Astro, React, or static HTML).</span>
            </li>
            <li>
            <span class="step-number">2</span>
            <span>Commit and push your files to GitHub.</span>
            </li>
            <li>
            <span class="step-number">3</span>
            <span>The pipeline will automatically build and deploy your live web application.</span>
            </li>
            </ul>
            </div>
            </div>
            <footer>
            <p>LABEIM Shared CI/CD Pipeline &middot; Cloudflare Pages Deployment</p>
            </footer>
            </main>
            </body>
            </html>
          HTML_EOF

              cp "${DIST_DIR}/index.html" "${DIST_DIR}/404.html"
              echo "/*    /index.html   200" > "${DIST_DIR}/_redirects"
              cat << 'ROBOTS_EOF' > "${DIST_DIR}/robots.txt"
            User-agent: *
            Allow: /
          ROBOTS_EOF
            fi

            # Auto-create Pages project shell if it does not exist yet
            npx --yes wrangler pages project create "$CLEAN_PROJECT" --production-branch="$PROD_BRANCH" > /dev/null 2>&1 || true

            # Deploy with retry logic (3 attempts, exponential backoff)
            MAX_RETRIES=3
            RETRY_DELAY=10
            for ATTEMPT in $(seq 1 $MAX_RETRIES); do
              echo "::group::Cloudflare deployment attempt $ATTEMPT/$MAX_RETRIES"
              if npx --yes wrangler pages deploy "$DIST_DIR" \
                --project-name="$CLEAN_PROJECT" \
                --branch="$BRANCH_NAME" \
                --commit-dirty=true 2>&1 | tee cf_deploy.log; then
                echo "::endgroup::"
                echo "Deployment succeeded on attempt $ATTEMPT"
                break
              fi
              echo "::endgroup::"
              if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
                echo "Attempt $ATTEMPT failed, retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
                RETRY_DELAY=$((RETRY_DELAY * 2))
              else
                echo "::error::All $MAX_RETRIES deployment attempts to Cloudflare Pages failed."
                exit 1
              fi
            done

            PROD_URL=$(grep -i "Production URL:" cf_deploy.log | grep -oP 'https://[a-zA-Z0-9.-]+\.pages\.dev' | head -1 | tr -cd 'a-zA-Z0-9.:/_-' || true)
            BRANCH_PREVIEW_URL=$(grep -i "Branch Preview URL:" cf_deploy.log | grep -oP 'https://[a-zA-Z0-9.-]+\.pages\.dev' | head -1 | tr -cd 'a-zA-Z0-9.:/_-' || true)

            DEPLOY_URL=""
            if [ "$IS_PROD" = "true" ]; then
              if [ -n "$PROD_URL" ]; then
                DEPLOY_URL="$PROD_URL"
              else
                DEPLOY_URL="https://${CLEAN_PROJECT}.pages.dev"
              fi
            else
              if [ -n "$BRANCH_PREVIEW_URL" ]; then
                DEPLOY_URL="$BRANCH_PREVIEW_URL"
              fi
            fi

            if [ -z "$DEPLOY_URL" ]; then
              DEPLOY_URL=$(sed 's/\x1B\[[0-9;]*[a-zA-Z]//g' cf_deploy.log \
                | grep -oP 'https://[a-zA-Z0-9.-]+\.(pages\.dev|workers\.dev)' \
                | grep -iv 'dash\.cloudflare\|api\.cloudflare' \
                | head -1 \
                | tr -cd 'a-zA-Z0-9.:/_-' || true)
            fi

            if [ -z "$DEPLOY_URL" ] || ! echo "$DEPLOY_URL" | grep -q '^https://'; then
              if [ "$IS_PROD" = "true" ]; then
                DEPLOY_URL="https://${CLEAN_PROJECT}.pages.dev"
              else
                DEPLOY_URL="https://${CLEAN_BRANCH}.${CLEAN_PROJECT}.pages.dev"
              fi
            fi
          fi

          echo "Captured Cloudflare deployment URL: $DEPLOY_URL"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          BUILD_TYPE="Direct Upload (Wrangler)"
          if [ -n "$DEPLOY_HOOK" ]; then
            BUILD_TYPE="Remote (Cloudflare Pages Build Runner)"
          fi
          {
            echo "### Cloudflare Pages Deployment"
            echo ""
            echo "| Detail | Value |"
            echo "| :--- | :--- |"
            echo "| URL | ${{ steps.deploy_cf.outputs.deploy_url }} |"
            echo "| Branch | \`${TARGET_BRANCH}\` |"
            echo "| Build Mode | ${BUILD_TYPE} |"
            echo "| Status | Deployed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────
  # Stage 2b: Deploy to Vercel (Parallel / Optional / Remote Builder)
  # ──────────────────────────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel
    needs: [validate-and-build]
    if: >-
      inputs.enable_vercel == true &&
      !cancelled() &&
      (needs.validate-and-build.result == 'success' || needs.validate-and-build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'vercel-preview' || 'vercel-production' }}
      url: ${{ steps.resolve_url.outputs.deploy_url }}
    outputs:
      deploy_url: ${{ steps.resolve_url.outputs.deploy_url }}
    env:
      VERCEL_ORG_ID: ${{ inputs.vercel_org_id }}
      VERCEL_PROJECT_ID: ${{ inputs.vercel_project_id }}
    steps:
      - name: Checkout repository (for remote build / standalone deploy)
        if: inputs.build_location == 'vercel' || inputs.build_location == 'none' || inputs.build_location == 'skip'
        uses: actions/checkout@v4

      - name: Download dist build artifact (for prebuilt GitHub build)
        if: inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto'
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: _dist_assets/

      - name: Pull Vercel project settings
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::VERCEL_TOKEN, vercel_project_id, and vercel_org_id are required to deploy to Vercel."
            exit 1
          fi

          ENV_ARG="preview"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            ENV_ARG="production"
          fi
          npx --yes vercel@latest pull --yes --environment="$ENV_ARG" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel Output API structure (Prebuilt only)
        if: inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto'
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p .vercel/output/static
          if [ -d "_dist_assets" ] && [ "$(ls -A _dist_assets 2>/dev/null)" ]; then
            cp -r _dist_assets/. .vercel/output/static/
          fi
          if [ ! -f .vercel/output/static/index.html ]; then
            echo "Scaffolding Vercel static fallback index.html..."
            cat << 'HTML_EOF' > .vercel/output/static/index.html
            <!DOCTYPE html>
            <html lang="en">
            <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Deployment Active</title>
            <meta name="description" content="Connected to LABEIM CI/CD pipeline. Deployment is active and ready for development.">
            </head>
            <body>
            <h1>Deployment Active</h1>
            </body>
            </html>
          HTML_EOF
          fi
          printf '{"version":3}\n' > .vercel/output/config.json
          echo "Vercel Output API structure ready:"
          ls -la .vercel/output/

      - name: Deploy to Vercel (with retry)
        id: deploy
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          BUILD_LOCATION: ${{ inputs.build_location }}
        run: |
          PROD_FLAG=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            PROD_FLAG="--prod"
          fi

          BUILD_FLAG="--prebuilt"
          if [ "$BUILD_LOCATION" = "vercel" ]; then
            BUILD_FLAG=""
            echo "Executing remote build on Vercel infrastructure (skipping local GitHub build)..."
          else
            echo "Deploying prebuilt static bundle to Vercel..."
          fi

          MAX_RETRIES=3
          RETRY_DELAY=10
          DEPLOY_EXIT=1
          for ATTEMPT in $(seq 1 $MAX_RETRIES); do
            echo "::group::Vercel deployment attempt $ATTEMPT/$MAX_RETRIES"
            npx --yes vercel@latest deploy $BUILD_FLAG $PROD_FLAG --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee vercel_deploy.log
            DEPLOY_EXIT=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$DEPLOY_EXIT" -eq 0 ]; then
              echo "Deployment succeeded on attempt $ATTEMPT"
              break
            fi
            if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
              echo "Attempt $ATTEMPT failed (exit $DEPLOY_EXIT), retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            else
              echo "::error::All $MAX_RETRIES deployment attempts to Vercel failed."
              exit 1
            fi
          done

      - name: Resolve Vercel deployment URL via REST API
        id: resolve_url
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Querying Vercel API for latest deployment URL matching commit ${COMMIT_SHA}..."
          API_RESPONSE=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=10" \
            || echo "")

          DEPLOY_HOST=""
          if [ -n "$API_RESPONSE" ]; then
            DEPLOY_HOST=$(node -e '
              try {
                const res = JSON.parse(process.argv[1]);
                const sha = process.env.COMMIT_SHA;
                const deps = res.deployments || [];
                const match = deps.find(d => d.meta && (d.meta.githubCommitSha === sha || d.meta.commitSha === sha)) || deps[0];
                if (match && match.url) {
                  console.log(match.url);
                }
              } catch (e) {}
            ' "$API_RESPONSE")
          fi

          if [ -z "$DEPLOY_HOST" ] && [ -f vercel_deploy.log ]; then
            DEPLOY_HOST=$(grep -oP 'https://[a-zA-Z0-9.-]+\.vercel\.app' vercel_deploy.log | head -1 | tr -cd 'a-zA-Z0-9.:/_-' || true)
          fi

          if [ -n "$DEPLOY_HOST" ]; then
            case "$DEPLOY_HOST" in
              https://*) DEPLOY_URL="$DEPLOY_HOST" ;;
              *)         DEPLOY_URL="https://${DEPLOY_HOST}" ;;
            esac
            echo "Resolved Vercel deployment URL: $DEPLOY_URL"
          else
            echo "::warning::Could not resolve Vercel deployment URL via REST API or logs."
            DEPLOY_URL=""
          fi

          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_LOCATION: ${{ inputs.build_location }}
        run: |
          BUILD_TYPE="Prebuilt (GitHub Actions)"
          if [ "$BUILD_LOCATION" = "vercel" ]; then
            BUILD_TYPE="Remote (Vercel Cloud Build)"
          fi
          {
            echo "### Vercel Deployment"
            echo ""
            echo "| Detail | Value |"
            echo "| :--- | :--- |"
            echo "| URL | ${{ steps.resolve_url.outputs.deploy_url }} |"
            echo "| Branch | \`${TARGET_BRANCH}\` |"
            echo "| Build Location | ${BUILD_TYPE} |"
            echo "| Status | Deployed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────
  # Stage 3: Post PR Preview Comment (Optional)
  # ──────────────────────────────────────────────────────────────────────
  comment-pr:
    name: Post PR Preview Comment
    needs: [deploy-cloudflare, deploy-vercel]
    if: >-
      inputs.enable_pr_comment == true &&
      github.event_name == 'pull_request' &&
      !cancelled() &&
      (needs.deploy-cloudflare.result == 'success' || needs.deploy-vercel.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Build comment body
        id: build_body
        env:
          CF_URL: ${{ needs.deploy-cloudflare.outputs.deploy_url }}
          VERCEL_URL: ${{ needs.deploy-vercel.outputs.deploy_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          CF_CLEAN=$(echo "$CF_URL" | tr -cd 'a-zA-Z0-9.:/_-')
          VERCEL_CLEAN=$(echo "$VERCEL_URL" | tr -cd 'a-zA-Z0-9.:/_-')

          {
            echo "body<<COMMENT_EOF"
            echo "<!-- shared-ci-cd:pr-preview -->"
            echo "### Preview Deployments Ready"
            echo ""
            echo "| Platform | Preview URL | Status |"
            echo "| :--- | :--- | :---: |"
            if [ -n "$CF_CLEAN" ]; then
              echo "| **Cloudflare Pages** | [$CF_CLEAN]($CF_CLEAN) | Live |"
            fi
            if [ -n "$VERCEL_CLEAN" ]; then
              echo "| **Vercel** | [$VERCEL_CLEAN]($VERCEL_CLEAN) | Live |"
            fi
            echo ""
            echo "---"
            echo "*Commit: \`${HEAD_SHA}\` · Workflow: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
            echo "COMMENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find existing preview comment
        uses: peter-evans/find-comment@v4
        id: find_comment
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- shared-ci-cd:pr-preview -->'

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v5
        continue-on-error: true
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.build_body.outputs.body }}
          edit-mode: replace

  # ──────────────────────────────────────────────────────────────────────
  # Stage 4: Lighthouse Performance Audit (Optional)
  # ──────────────────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse Audit
    needs: [validate-and-build, deploy-cloudflare, deploy-vercel]
    if: >-
      always() &&
      inputs.enable_lighthouse == true &&
      !cancelled() &&
      (needs.deploy-cloudflare.result == 'success' || needs.deploy-vercel.result == 'success' || (inputs.enable_cloudflare == false && inputs.enable_vercel == false && needs.validate-and-build.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dist build artifact (if available)
        if: inputs.build_location == 'github' || inputs.build_location == '' || inputs.build_location == 'auto'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: _dist_assets/

      - name: Resolve target URL for Lighthouse
        id: target_url
        env:
          CF_NEEDS_URL: ${{ needs.deploy-cloudflare.outputs.deploy_url }}
          VERCEL_NEEDS_URL: ${{ needs.deploy-vercel.outputs.deploy_url }}
        run: |
          TARGET=""
          if [ -n "$CF_NEEDS_URL" ]; then
            TARGET=$(echo "$CF_NEEDS_URL" | tr -cd 'a-zA-Z0-9.:/_-')
          elif [ -n "$VERCEL_NEEDS_URL" ]; then
            TARGET=$(echo "$VERCEL_NEEDS_URL" | tr -cd 'a-zA-Z0-9.:/_-')
          fi

          echo "Resolved target URL: '${TARGET:-(static fallback)}'"
          echo "url=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Build Lighthouse URL list
        if: steps.target_url.outputs.url != ''
        id: build_url_list
        env:
          BASE_URL: ${{ steps.target_url.outputs.url }}
          ROUTES: ${{ inputs.lighthouse_routes }}
        run: |
          BASE="${BASE_URL%/}"
          {
            echo "urls<<EOF_URLS"
            for ROUTE in $ROUTES; do
              CLEAN_ROUTE="${ROUTE#/}"
              if [ -z "$CLEAN_ROUTE" ]; then
                echo "${BASE}/"
              else
                echo "${BASE}/${CLEAN_ROUTE}"
              fi
            done
            echo "EOF_URLS"
          } >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse audit (Live URL)
        if: steps.target_url.outputs.url != ''
        id: lighthouse_live
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ${{ inputs.lighthouse_config_path }}
          urls: ${{ steps.build_url_list.outputs.urls }}
          uploadArtifacts: true

      - name: Ensure static build fallback exists for Lighthouse
        if: steps.target_url.outputs.url == ''
        shell: bash
        run: |
          if [ -d "_dist_assets" ] && [ ! -d "dist" ]; then
            cp -r _dist_assets dist
          fi
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            mkdir -p dist
            cat << 'HTML_EOF' > dist/index.html
            <!DOCTYPE html>
            <html lang="en">
            <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Deployment Active</title>
            <meta name="description" content="Connected to LABEIM CI/CD pipeline. Deployment is active and ready for development.">
            </head>
            <body>
            <main>
            <h1>Deployment Active</h1>
            <p>Application is ready.</p>
            </main>
            </body>
            </html>
          HTML_EOF
          fi

      - name: Run Lighthouse audit (Static Fallback)
        if: steps.target_url.outputs.url == ''
        id: lighthouse_static
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ${{ inputs.lighthouse_config_path }}
          uploadArtifacts: true

      - name: Format and record Lighthouse summary
        if: always()
        id: parse_lh
        env:
          TARGET_URL: ${{ steps.target_url.outputs.url }}
          LIVE_LINKS: ${{ steps.lighthouse_live.outputs.links }}
          STATIC_LINKS: ${{ steps.lighthouse_static.outputs.links }}
        run: |
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const targetUrl = process.env.TARGET_URL || "static dist/";
            const liveLinksStr = process.env.LIVE_LINKS || "";
            const staticLinksStr = process.env.STATIC_LINKS || "";
            const summaryFile = process.env.GITHUB_STEP_SUMMARY;
            const outputFile = process.env.GITHUB_OUTPUT;

            let manifest = null;
            let links = {};

            if (fs.existsSync(".lighthouseci/manifest.json")) {
              try {
                manifest = JSON.parse(fs.readFileSync(".lighthouseci/manifest.json", "utf8"));
              } catch (e) {}
            }

            try {
              const rawLinks = liveLinksStr || staticLinksStr;
              if (rawLinks) links = JSON.parse(rawLinks);
            } catch (e) {}

            if (Object.keys(links).length === 0 && fs.existsSync(".lighthouseci/links.json")) {
              try {
                links = JSON.parse(fs.readFileSync(".lighthouseci/links.json", "utf8"));
              } catch (e) {}
            }

            let md = "### Lighthouse Audit Results\n\n";
            md += `**Target URL:** \`${targetUrl}\`\n\n`;

            if (manifest && Array.isArray(manifest) && manifest.length > 0) {
              const representativeRuns = manifest.filter(r => r.isRepresentativeRun);
              const runsToDisplay = representativeRuns.length > 0 ? representativeRuns : [manifest[0]];

              runsToDisplay.forEach((run, idx) => {
                const summary = run.summary || {};
                const reportUrl = links[run.url] || links[Object.keys(links)[idx]] || null;

                const getStatus = (score) => {
                  if (score === undefined || score === null) return { pct: "N/A", status: "N/A" };
                  const pct = Math.round(score * 100);
                  if (pct >= 90) return { pct: `${pct}%`, status: "Pass" };
                  if (pct >= 50) return { pct: `${pct}%`, status: "Average" };
                  return { pct: `${pct}%`, status: "Fail" };
                };

                const perf = getStatus(summary.performance);
                const a11y = getStatus(summary.accessibility);
                const bp = getStatus(summary["best-practices"]);
                const seo = getStatus(summary.seo);

                const pageLabel = run.url
                  ? (() => {
                      try {
                        const u = new URL(run.url);
                        const path = u.pathname === "/" ? "(Home)" : u.pathname;
                        return `**Path: \`${path}\`**`;
                      } catch (e) {
                        return `**URL: \`${run.url}\`**`;
                      }
                    })()
                  : `**Run ${idx + 1}**`;
                md += `${pageLabel}\n\n`;

                md += "| Category | Score | Status |\n";
                md += "| :--- | :---: | :--- |\n";
                md += `| Performance | **${perf.pct}** | ${perf.status} |\n`;
                md += `| Accessibility | **${a11y.pct}** | ${a11y.status} |\n`;
                md += `| Best Practices | **${bp.pct}** | ${bp.status} |\n`;
                md += `| SEO | **${seo.pct}** | ${seo.status} |\n\n`;

                if (reportUrl) {
                  md += `[View Interactive Lighthouse Report](${reportUrl})\n\n`;
                }
              });
              md += "*Full reports saved in workflow artifacts (`lhci-artifacts`).*\n";
            } else {
              md += "Note: *No Lighthouse audit manifest could be read. Check workflow artifacts for details.*\n";
            }

            if (summaryFile) {
              fs.appendFileSync(summaryFile, md);
            }

            if (outputFile) {
              const eof = "EOF_" + Math.random().toString(36).substring(2);
              fs.appendFileSync(outputFile, `comment_body<<${eof}\n${md}\n${eof}\n`);
            }
          '

      - name: Find existing PR comment
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v4
        id: find_comment
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- shared-ci-cd:pr-preview -->'

      - name: Append Lighthouse results to PR comment
        if: always() && github.event_name == 'pull_request' && steps.find_comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        continue-on-error: true
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          body: |
            
            ---
            ${{ steps.parse_lh.outputs.comment_body }}
          edit-mode: append
