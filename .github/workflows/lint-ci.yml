name: "Validate Workflows & Actions"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Validate Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          level: info

      - name: Validate YAML syntax
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.yml' '*.yaml')
          (( ${#files[@]} )) || { echo "::error::no YAML files found"; exit 1; }
          ruby -rpsych -e 'ARGV.each { |f| Psych.parse_file(f) }' "${files[@]}"
          echo "Parsed ${#files[@]} YAML files."
