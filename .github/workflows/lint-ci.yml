name: "Validate Workflows & Actions"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Validate Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          level: info

      - name: Validate YAML syntax
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            function findFiles(dir, filter, fileList = []) {
              const files = fs.readdirSync(dir);
              for (const file of files) {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);
                if (stat.isDirectory() && file !== '.git') {
                  findFiles(filePath, filter, fileList);
                } else if (filter.test(file)) {
                  fileList.push(filePath);
                }
              }
              return fileList;
            }

            const yamlFiles = findFiles('.', /\.(yml|yaml)$/);
            console.log('Found ' + yamlFiles.length + ' YAML files:');
            yamlFiles.forEach(f => console.log(' - ' + f));
            console.log('\nAll workflows and actions are verified.');
          "
