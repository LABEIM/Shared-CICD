name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:
    inputs:
      fail_on_severity:
        description: 'Minimum severity to fail the job (low, moderate, high, critical)'
        required: false
        type: string
        default: 'high'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: ${{ inputs.fail_on_severity || 'high' }}
