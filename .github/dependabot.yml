version: 2
updates:
  # Workflows only. Composite actions are separate entries below: the root entry
  # scans .github/workflows and a root action.yml, not action directories.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps):"
    labels:
      - "dependencies"
      - "ci"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"

  # A non-root directory is scanned for *.yml directly, so these are the only way
  # Dependabot sees the `uses:` refs inside a composite action.
  - package-ecosystem: "github-actions"
    directory: "/actions/setup-and-build"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps):"
    labels:
      - "dependencies"
      - "ci"
      - "automated"

  - package-ecosystem: "github-actions"
    directory: "/actions/lighthouse-audit"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps):"
    labels:
      - "dependencies"
      - "ci"
      - "automated"

  - package-ecosystem: "github-actions"
    directory: "/actions/pr-preview-comment"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps):"
    labels:
      - "dependencies"
      - "ci"
      - "automated"
