name: 'Deploy to Vercel (Prebuilt Output API v3)'
description: 'Deploys pre-built static site to Vercel via Build Output API v3 with retries and REST API URL resolution'

inputs:
  project_id:
    description: 'Vercel Project ID'
    required: true
  org_id:
    description: 'Vercel Organization ID or Team ID'
    required: true
  vercel_token:
    description: 'Vercel Authentication Token'
    required: true
  dist_dir:
    description: 'Directory containing built static files'
    required: false
    default: 'dist'
  max_retries:
    description: 'Maximum retry attempts'
    required: false
    default: '3'
  retry_delay:
    description: 'Initial retry backoff in seconds'
    required: false
    default: '10'

outputs:
  deploy_url:
    description: 'The resolved live or preview deployment URL'
    value: ${{ steps.resolve_url.outputs.deploy_url }}
  is_production:
    description: 'Whether this was a production deployment'
    value: ${{ steps.deploy.outputs.is_production }}

runs:
  using: 'composite'
  steps:
    - name: Validate requirements
      shell: bash
      run: |
        if [ -z "${{ inputs.vercel_token }}" ] || [ -z "${{ inputs.project_id }}" ] || [ -z "${{ inputs.org_id }}" ]; then
          echo "::error::vercel_token, project_id, and org_id are required to deploy to Vercel."
          exit 1
        fi

    - name: Install Vercel CLI
      shell: bash
      run: npm install --global vercel@latest

    - name: Pull Vercel project settings
      shell: bash
      env:
        VERCEL_ORG_ID: ${{ inputs.org_id }}
        VERCEL_PROJECT_ID: ${{ inputs.project_id }}
      run: |
        ENV_ARG="preview"
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          ENV_ARG="production"
        fi
        vercel pull --yes --environment="$ENV_ARG" --token="${{ inputs.vercel_token }}"

    - name: Build Vercel Output API structure
      shell: bash
      run: |
        DIST="${{ inputs.dist_dir }}"
        mkdir -p .vercel/output/static
        cp -r "${DIST}"/. .vercel/output/static/
        printf '{"version":3}\n' > .vercel/output/config.json
        echo "Vercel Output API structure prepared:"
        ls -la .vercel/output/

    - name: Deploy to Vercel (with retry)
      id: deploy
      shell: bash
      env:
        VERCEL_ORG_ID: ${{ inputs.org_id }}
        VERCEL_PROJECT_ID: ${{ inputs.project_id }}
        MAX_RETRIES: ${{ inputs.max_retries }}
        INITIAL_RETRY_DELAY: ${{ inputs.retry_delay }}
      run: |
        PROD_FLAG=""
        IS_PROD="false"
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          PROD_FLAG="--prod"
          IS_PROD="true"
        fi
        echo "is_production=$IS_PROD" >> "$GITHUB_OUTPUT"

        RETRY_DELAY=$INITIAL_RETRY_DELAY
        DEPLOY_EXIT=1
        for ATTEMPT in $(seq 1 $MAX_RETRIES); do
          echo "::group::Vercel deployment attempt $ATTEMPT/$MAX_RETRIES"
          vercel deploy --prebuilt $PROD_FLAG --yes --token="${{ inputs.vercel_token }}" 2>&1
          DEPLOY_EXIT=$?
          echo "::endgroup::"
          if [ "$DEPLOY_EXIT" -eq 0 ]; then
            echo "Deployment succeeded on attempt $ATTEMPT"
            break
          fi
          if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
            echo "Attempt $ATTEMPT failed (exit $DEPLOY_EXIT), retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          else
            echo "::error::All $MAX_RETRIES deployment attempts to Vercel failed."
            exit 1
          fi
        done

    - name: Resolve Vercel deployment URL via REST API
      id: resolve_url
      shell: bash
      env:
        VERCEL_PROJECT_ID: ${{ inputs.project_id }}
        VERCEL_ORG_ID: ${{ inputs.org_id }}
        VERCEL_TOKEN: ${{ inputs.vercel_token }}
      run: |
        echo "Querying Vercel API for latest deployment URL..."
        API_RESPONSE=$(curl -sf \
          -H "Authorization: Bearer ${VERCEL_TOKEN}" \
          "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=1" \
          || echo "")

        if command -v jq &>/dev/null; then
          DEPLOY_HOST=$(echo "$API_RESPONSE" | jq -r '.deployments[0].url // empty' 2>/dev/null)
        else
          DEPLOY_HOST=$(echo "$API_RESPONSE" \
            | grep -oP '"url"\s*:\s*"\K[^"]+' \
            | head -1)
        fi

        if [ -n "$DEPLOY_HOST" ]; then
          case "$DEPLOY_HOST" in
            https://*) DEPLOY_URL="$DEPLOY_HOST" ;;
            *)         DEPLOY_URL="https://${DEPLOY_HOST}" ;;
          esac
          echo "Resolved Vercel deployment URL: $DEPLOY_URL"
        else
          echo "::warning::Could not resolve Vercel deployment URL via REST API."
          DEPLOY_URL=""
        fi

        echo "$DEPLOY_URL" > vercel_deploy_url.txt
        echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

    - name: Upload Vercel deploy URL artifact
      uses: actions/upload-artifact@v4
      with:
        name: vercel-deploy-url
        path: vercel_deploy_url.txt
        retention-days: 1

    - name: Record Vercel deployment summary
      shell: bash
      env:
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        {
          echo "### Vercel Deployment"
          echo ""
          echo "| Detail | Value |"
          echo "| :--- | :--- |"
          echo "| URL | ${{ steps.resolve_url.outputs.deploy_url }} |"
          echo "| Branch | \`${TARGET_BRANCH}\` |"
          echo "| Mode | ${{ steps.deploy.outputs.is_production == 'true' && 'Production' || 'Preview' }} |"
          echo "| Status | Deployed |"
        } >> "$GITHUB_STEP_SUMMARY"
