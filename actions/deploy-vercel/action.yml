name: 'Deploy to Vercel (Prebuilt Output API v3 or Remote Cloud Build)'
description: 'Deploys static site to Vercel via Build Output API v3 or delegates compilation to Vercel Remote Build infrastructure with retries and REST API URL resolution'

inputs:
  working_directory:
    description: 'Working directory for projects in monorepos or subdirectories'
    required: false
    default: '.'
  project_id:
    description: 'Vercel Project ID'
    required: true
  org_id:
    description: 'Vercel Organization ID or Team ID'
    required: true
  vercel_token:
    description: 'Vercel Authentication Token'
    required: true
  dist_dir:
    description: 'Directory containing built static files (used when remote_build is false)'
    required: false
    default: 'dist'
  remote_build:
    description: 'Whether to build remotely on Vercel infrastructure instead of deploying prebuilt output'
    required: false
    default: 'false'
  prepare_output:
    description: 'Whether to build .vercel/output from dist_dir (set to false to deploy an existing .vercel/output)'
    required: false
    default: 'true'
  max_retries:
    description: 'Maximum retry attempts'
    required: false
    default: '3'
  retry_delay:
    description: 'Initial retry backoff in seconds'
    required: false
    default: '10'
  production_branch:
    description: 'Branch that deploys to production; other branches deploy previews'
    required: false
    default: 'main'
  enable_previews:
    description: 'Deploy preview environments for non-production refs'
    required: false
    default: 'true'

outputs:
  deploy_url:
    description: 'The resolved live or preview deployment URL'
    value: ${{ steps.resolve_url.outputs.deploy_url }}
  is_production:
    description: 'Whether this was a production deployment'
    value: ${{ steps.guard.outputs.is_production }}
  used_placeholder:
    description: 'Whether a bootstrap placeholder was staged because the output had no index.html'
    value: ${{ steps.prepare_output.outputs.used_placeholder }}

runs:
  using: 'composite'
  steps:
    - name: Check preview eligibility
      id: guard
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        ENABLE_PREVIEWS: ${{ inputs.enable_previews }}
        RAW_HEAD_REF: ${{ github.head_ref }}
        RAW_REF_NAME: ${{ github.ref_name }}
        PROD_BRANCH: ${{ inputs.production_branch }}
      run: |
        BRANCH_NAME="${RAW_HEAD_REF:-$RAW_REF_NAME}"
        IS_PROD="false"
        if [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ] && [ "${GITHUB_EVENT_NAME:-}" != "pull_request_target" ] \
          && [ "${GITHUB_REF_TYPE:-}" = "branch" ] && [ "$BRANCH_NAME" = "$PROD_BRANCH" ]; then
          IS_PROD="true"
        fi
        SKIP="false"
        PROD_FLAG=""
        if [ "$IS_PROD" = "true" ]; then PROD_FLAG="--prod"; fi
        if [ "$ENABLE_PREVIEWS" != "true" ] && [ "$IS_PROD" != "true" ]; then
          SKIP="true"
          echo "::notice::Preview deployments are disabled (enable_previews=false); skipping."
        fi
        echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
        echo "is_production=$IS_PROD" >> "$GITHUB_OUTPUT"
        echo "prod_flag=$PROD_FLAG" >> "$GITHUB_OUTPUT"

    - name: Validate Vercel deployment credentials
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        VERCEL_TOKEN: ${{ inputs.vercel_token }}
        PROJECT_ID: ${{ inputs.project_id }}
        ORG_ID: ${{ inputs.org_id }}
      run: |
        if [ -z "$VERCEL_TOKEN" ] || [ -z "$PROJECT_ID" ] || [ -z "$ORG_ID" ]; then
          echo "::error::vercel_token, project_id, and org_id are required to deploy to Vercel."
          exit 1
        fi

    - name: Pull Vercel project settings
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        VERCEL_ORG_ID: ${{ inputs.org_id }}
        VERCEL_PROJECT_ID: ${{ inputs.project_id }}
        VERCEL_TOKEN: ${{ inputs.vercel_token }}
        VERCEL_VERSION: '65.14.0'
        IS_PROD: ${{ steps.guard.outputs.is_production }}
      run: |
        ENV_ARG="preview"
        if [ "$IS_PROD" = "true" ]; then ENV_ARG="production"; fi
        # Pinned in VERCEL_VERSION above; this runs in the job holding VERCEL_TOKEN.
        npx --yes --ignore-scripts "vercel@${VERCEL_VERSION:?VERCEL_VERSION must be set}" pull --yes --environment="$ENV_ARG" --token="$VERCEL_TOKEN"

    - name: Build Vercel Output API structure
      id: prepare_output
      if: steps.guard.outputs.skip != 'true' && inputs.remote_build != 'true' && inputs.prepare_output == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        DIST_DIR: ${{ inputs.dist_dir }}
      run: |
        DIST="$DIST_DIR"
        # Astro 7 SSR builds keep the site under client/; serve those prerendered assets.
        if [ -f "$DIST/server/wrangler.json" ] && [ -d "$DIST/client" ]; then
          DIST="$DIST/client"
        fi
        mkdir -p .vercel/output/static
        if [ "$DIST" = "." ] || [ "$DIST" = "./" ]; then
          # Depth-1 credential exclusion; upload-artifact's denylist is the recursive boundary.
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' ! -name '.vercel' ! -name 'node_modules' ! -name '.lighthouseci' \
            ! -name '.env*' ! -name '.dev.vars*' ! -name '.npmrc' ! -name '.yarnrc*' ! -name '.netrc' ! -name '.git-credentials' ! -name '.pypirc' ! -name '.aws' ! -name '.ssh' ! -name '.docker' ! -name '*.pem' ! -name 'id_rsa*' \
            -exec cp -r {} .vercel/output/static/ \;
        elif [ -d "$DIST" ] && [ "$(ls -A "$DIST" 2>/dev/null)" ]; then
          # -H so a symlinked dist_dir is copied, not silently skipped.
          find -H "$DIST" -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.env*' ! -name '.dev.vars*' ! -name '.npmrc' ! -name '.yarnrc*' ! -name '.netrc' ! -name '.git-credentials' ! -name '.pypirc' ! -name '.aws' ! -name '.ssh' ! -name '.docker' ! -name '*.pem' ! -name 'id_rsa*' \
            -exec cp -r {} .vercel/output/static/ \;
        fi
        if [ ! -f .vercel/output/static/index.html ]; then
          echo "used_placeholder=true" >> "$GITHUB_OUTPUT"
          echo "Scaffolding Vercel static fallback index.html..."
          cat << 'HTML_EOF' > .vercel/output/static/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Deployment Active</title>
          <meta name="description" content="Connected to LABEIM CI/CD pipeline. Deployment is active and ready for development.">
          </head>
          <body>
          <h1>Deployment Active</h1>
          </body>
          </html>
        HTML_EOF
        fi
        printf '{"version":3}\n' > .vercel/output/config.json
        echo "Vercel Output API structure prepared:"
        ls -la .vercel/output/

    - name: Deploy to Vercel (with retry)
      id: deploy
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        VERCEL_ORG_ID: ${{ inputs.org_id }}
        VERCEL_PROJECT_ID: ${{ inputs.project_id }}
        VERCEL_TOKEN: ${{ inputs.vercel_token }}
        VERCEL_VERSION: '65.14.0'
        MAX_RETRIES: ${{ inputs.max_retries }}
        INITIAL_RETRY_DELAY: ${{ inputs.retry_delay }}
        REMOTE_BUILD: ${{ inputs.remote_build }}
        PROD_FLAG: ${{ steps.guard.outputs.prod_flag }}
      run: |
        BUILD_FLAG="--prebuilt"
        if [ "$REMOTE_BUILD" = "true" ]; then
          BUILD_FLAG=""
          echo "Executing remote build on Vercel cloud infrastructure..."
        else
          echo "Deploying prebuilt static output to Vercel..."
        fi

        RETRY_DELAY=$INITIAL_RETRY_DELAY
        DEPLOY_EXIT=1
        for ATTEMPT in $(seq 1 $MAX_RETRIES); do
          echo "::group::Vercel deployment attempt $ATTEMPT/$MAX_RETRIES"
          npx --yes --ignore-scripts "vercel@${VERCEL_VERSION:?VERCEL_VERSION must be set}" deploy $BUILD_FLAG $PROD_FLAG --yes --token="$VERCEL_TOKEN" 2>&1 | tee vercel_deploy.log
          DEPLOY_EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$DEPLOY_EXIT" -eq 0 ]; then
            echo "Deployment succeeded on attempt $ATTEMPT"
            break
          fi
          if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
            echo "Attempt $ATTEMPT failed (exit $DEPLOY_EXIT), retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          else
            echo "::error::All $MAX_RETRIES deployment attempts to Vercel failed."
            exit 1
          fi
        done

    - name: Resolve Vercel deployment URL via REST API
      id: resolve_url
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        VERCEL_PROJECT_ID: ${{ inputs.project_id }}
        VERCEL_ORG_ID: ${{ inputs.org_id }}
        VERCEL_TOKEN: ${{ inputs.vercel_token }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        # shellcheck disable=SC2016
        echo "Querying Vercel API for deployment URL matching commit ${COMMIT_SHA}..."
        API_RESPONSE=$(curl -sf \
          -H "Authorization: Bearer ${VERCEL_TOKEN}" \
          "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=10" \
          || echo "")

        DEPLOY_HOST=""
        if [ -n "$API_RESPONSE" ]; then
          DEPLOY_HOST=$(node -e '
            try {
              const res = JSON.parse(process.argv[1]);
              const sha = process.env.COMMIT_SHA;
              const deps = res.deployments || [];
              const match = deps.find(d => d.meta && (d.meta.githubCommitSha === sha || d.meta.commitSha === sha)) || deps[0];
              if (match && match.url) {
                console.log(match.url);
              }
            } catch (e) {}
          ' "$API_RESPONSE")
        fi

        # Fallback: inspect vercel_deploy.log if API query didn't find URL
        if [ -z "$DEPLOY_HOST" ] && [ -f vercel_deploy.log ]; then
          DEPLOY_HOST=$(grep -oP 'https://[a-zA-Z0-9.-]+\.vercel\.app' vercel_deploy.log | head -1 | tr -cd 'a-zA-Z0-9.:/_-' || true)
        fi

        if [ -n "$DEPLOY_HOST" ]; then
          case "$DEPLOY_HOST" in
            https://*) DEPLOY_URL="$DEPLOY_HOST" ;;
            *)         DEPLOY_URL="https://${DEPLOY_HOST}" ;;
          esac
          echo "Resolved Vercel deployment URL: $DEPLOY_URL"
        else
          echo "::warning::Could not resolve Vercel deployment URL via API or logs."
          DEPLOY_URL=""
        fi

        echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

    - name: Record Vercel deployment summary
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        REMOTE_BUILD: ${{ inputs.remote_build }}
        DEPLOY_URL_SUMMARY: ${{ steps.resolve_url.outputs.deploy_url }}
        IS_PROD: ${{ steps.guard.outputs.is_production }}
        SKIP: ${{ steps.guard.outputs.skip }}
      run: |
        BUILD_TYPE="Prebuilt (GitHub Actions)"
        if [ "$REMOTE_BUILD" = "true" ]; then
          BUILD_TYPE="Remote (Vercel Cloud Build)"
        fi
        if [ "$IS_PROD" = "true" ]; then MODE="Production"; else MODE="Preview"; fi
        URL="${DEPLOY_URL_SUMMARY:-—}"
        STATUS="Deployed"
        if [ "$SKIP" = "true" ]; then
          MODE="Skipped"
          STATUS="Skipped (previews disabled)"
        fi
        BRANCH_LABEL=$(printf '%s' "$TARGET_BRANCH" | tr -cd 'a-zA-Z0-9._/-')
        {
          echo "### Vercel Deployment"
          echo ""
          echo "| Detail | Value |"
          echo "| :--- | :--- |"
          echo "| URL | ${URL} |"
          echo "| Branch | \`${BRANCH_LABEL}\` |"
          echo "| Build Location | ${BUILD_TYPE} |"
          echo "| Mode | ${MODE} |"
          echo "| Status | ${STATUS} |"
        } >> "$GITHUB_STEP_SUMMARY"
