name: 'Setup & Build Static Web App'
description: 'Sets up runtime, installs dependencies, runs checks, builds static site, and uploads dist artifact'

inputs:
  node_version:
    description: 'Node.js version'
    required: false
    default: '22'
  package_manager:
    description: 'Package manager to use (npm, pnpm, bun, yarn, none)'
    required: false
    default: 'npm'
  install_command:
    description: 'Custom install command (leave blank to auto-detect from package_manager, or "none" to skip)'
    required: false
    default: ''
  check_command:
    description: 'Optional lint/typecheck command (e.g. "npx astro check" or "npm run lint")'
    required: false
    default: ''
  build_command:
    description: 'Build command to generate static export (or "none" for pre-built/static projects)'
    required: false
    default: 'npm run build'
  dist_dir:
    description: 'Output directory containing built static files'
    required: false
    default: 'dist'
  upload_artifact:
    description: 'Whether to upload the dist directory as a workflow artifact'
    required: false
    default: 'true'
  artifact_name:
    description: 'Name of the uploaded dist artifact'
    required: false
    default: 'dist-static-build'
  artifact_retention_days:
    description: 'Number of days to retain the build artifact'
    required: false
    default: '3'

outputs:
  artifact_hash:
    description: 'Deterministic SHA256 hash of the build output'
    value: ${{ steps.hash.outputs.sha256 }}
  build_duration:
    description: 'Build duration in seconds'
    value: ${{ steps.build.outputs.duration }}

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm (if requested)
      if: inputs.package_manager == 'pnpm'
      uses: pnpm/action-setup@v6
      with:
        version: latest

    - name: Setup Bun (if requested)
      if: inputs.package_manager == 'bun'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Node.js
      if: inputs.package_manager != 'none' && inputs.package_manager != 'static'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ ((inputs.package_manager == 'npm' && hashFiles('package-lock.json', 'npm-shrinkwrap.json') != '') || (inputs.package_manager == 'pnpm' && hashFiles('pnpm-lock.yaml') != '') || (inputs.package_manager == 'yarn' && hashFiles('yarn.lock') != '')) && inputs.package_manager || '' }}

    - name: Install dependencies
      shell: bash
      run: |
        INSTALL_CMD="${{ inputs.install_command }}"
        PKG_MGR="${{ inputs.package_manager }}"

        if [ "$INSTALL_CMD" = "none" ] || [ "$INSTALL_CMD" = "false" ] || [ "$INSTALL_CMD" = "skip" ] || [ "$PKG_MGR" = "none" ] || [ "$PKG_MGR" = "static" ]; then
          echo "Dependency installation skipped explicitly."
        elif [ -n "$INSTALL_CMD" ]; then
          echo "Running custom install command: $INSTALL_CMD"
          eval "$INSTALL_CMD"
        elif [ ! -f "package.json" ]; then
          echo "No package.json detected. Zero-dependency static project identified — skipping dependency installation."
        else
          case "$PKG_MGR" in
            pnpm)
              echo "Installing with pnpm..."
              if [ -f "pnpm-lock.yaml" ]; then
                pnpm install --frozen-lockfile
              else
                pnpm install
              fi
              ;;
            bun)
              echo "Installing with bun..."
              if [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
                bun install --frozen-lockfile
              else
                bun install
              fi
              ;;
            yarn)
              echo "Installing with yarn..."
              if [ -f "yarn.lock" ]; then
                yarn install --frozen-lockfile
              else
                yarn install
              fi
              ;;
            *)
              echo "Installing with npm..."
              if [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ]; then
                npm ci
              else
                npm install
              fi
              ;;
          esac
        fi

    - name: Run Diagnostics / Checks
      if: inputs.check_command != ''
      shell: bash
      run: |
        echo "Running diagnostics check: ${{ inputs.check_command }}"
        ${{ inputs.check_command }}

    - name: Build static site export
      id: build
      shell: bash
      run: |
        BUILD_START=$(date +%s)
        BUILD_CMD="${{ inputs.build_command }}"

        if [ "$BUILD_CMD" = "none" ] || [ "$BUILD_CMD" = "false" ] || [ "$BUILD_CMD" = "skip" ] || [ -z "$BUILD_CMD" ]; then
          echo "Static project detected: build step skipped."
        elif [ "$BUILD_CMD" = "npm run build" ]; then
          if [ ! -f "package.json" ]; then
            echo "No package.json detected with default build command. Skipping build step for static project."
          elif ! node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.build ? 0 : 1)" 2>/dev/null; then
            echo "No 'build' script found in package.json. Skipping build step for static project."
          else
            echo "Running build command: $BUILD_CMD"
            npm run build
          fi
        else
          echo "Running custom build command: $BUILD_CMD"
          eval "$BUILD_CMD"
        fi

        BUILD_END=$(date +%s)
        BUILD_DURATION=$((BUILD_END - BUILD_START))
        echo "duration=${BUILD_DURATION}s" >> "$GITHUB_OUTPUT"

    - name: Stage static output directory (if needed)
      shell: bash
      run: |
        TARGET_DIR="${{ inputs.dist_dir }}"
        if [ ! -d "$TARGET_DIR" ]; then
          if [ "$TARGET_DIR" = "dist" ]; then
            if [ -d "public" ] && [ "$(ls -A public 2>/dev/null)" ]; then
              echo "Directory 'dist' not found. Auto-staging static files from 'public/' into 'dist/'..."
              mkdir -p dist
              cp -r public/* dist/ 2>/dev/null || cp -r public/. dist/
            elif [ -f "index.html" ]; then
              echo "Directory 'dist' not found. Auto-staging static root files into 'dist/'..."
              mkdir -p dist
              find . -maxdepth 1 ! -name '.' ! -name 'dist' ! -name '.git' ! -name '.github' ! -name '.vercel' ! -name 'node_modules' ! -name '.lighthouseci' -exec cp -r {} dist/ \;
            fi
          fi
        fi

    - name: Generate build artifact hash
      id: hash
      shell: bash
      run: |
        TARGET_DIR="${{ inputs.dist_dir }}"
        if [ -d "$TARGET_DIR" ]; then
          if [ "$TARGET_DIR" = "." ] || [ "$TARGET_DIR" = "./" ]; then
            HASH=$(find . -type f ! -path '*/.git/*' ! -path '*/.github/*' ! -path '*/node_modules/*' ! -path '*/.vercel/*' ! -path '*/.lighthouseci/*' -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
          else
            HASH=$(find "$TARGET_DIR" -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
          fi
          echo "sha256=${HASH}" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Dist directory '$TARGET_DIR' not found after build."
          echo "sha256=none" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload build artifact
      if: inputs.upload_artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.dist_dir }}/
        retention-days: ${{ inputs.artifact_retention_days }}

    - name: Build summary
      shell: bash
      env:
        BRANCH_NAME: ${{ github.ref_name }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        TARGET_DIR="${{ inputs.dist_dir }}"
        DIR_SIZE="N/A"
        if [ -d "$TARGET_DIR" ]; then
          DIR_SIZE=$(du -sh "$TARGET_DIR" | cut -f1)
        fi
        HASH="${{ steps.hash.outputs.sha256 }}"

        {
          echo "### Build Summary"
          echo ""
          echo "| Metric | Value |"
          echo "| :--- | :--- |"
          echo "| Build Duration | ${{ steps.build.outputs.duration }} |"
          echo "| Artifact SHA256 | \`${HASH:0:16}...\` |"
          echo "| Artifact Size | ${DIR_SIZE} |"
          echo "| Branch | \`${BRANCH_NAME}\` |"
          echo "| Commit | \`${COMMIT_SHA}\` |"
        } >> "$GITHUB_STEP_SUMMARY"
