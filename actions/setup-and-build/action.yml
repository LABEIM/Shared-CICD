name: 'Setup & Build Static Web App'
description: 'Sets up runtime, auto-detects package manager & output directories, installs dependencies, runs checks, builds static site, and uploads dist artifact'

inputs:
  working_directory:
    description: 'Working directory for projects in monorepos or subdirectories'
    required: false
    default: '.'
  node_version:
    description: 'Node.js version (or "auto" to read from .nvmrc / .node-version)'
    required: false
    default: '22'
  package_manager:
    description: 'Package manager to use ("auto", "npm", "pnpm", "bun", "yarn", "none", "static")'
    required: false
    default: 'auto'
  install_command:
    description: 'Custom install command (leave blank to auto-detect from package_manager, or "none" to skip)'
    required: false
    default: ''
  check_command:
    description: 'Optional lint/typecheck command (e.g. "npx astro check" or "npm run lint")'
    required: false
    default: ''
  build_command:
    description: 'Build command to generate static export (or "none" for pre-built/static projects, or "auto")'
    required: false
    default: 'npm run build'
  dist_dir:
    description: 'Output directory containing built static files (or "auto" to detect standard output folders)'
    required: false
    default: 'dist'
  upload_artifact:
    description: 'Whether to upload the dist directory as a workflow artifact'
    required: false
    default: 'true'
  artifact_name:
    description: 'Name of the uploaded dist artifact'
    required: false
    default: 'dist-static-build'
  artifact_retention_days:
    description: 'Number of days to retain the build artifact'
    required: false
    default: '3'

outputs:
  artifact_hash:
    description: 'Deterministic SHA256 hash of the build output'
    value: ${{ steps.hash.outputs.sha256 }}
  build_duration:
    description: 'Build duration in seconds'
    value: ${{ steps.build.outputs.duration }}
  detected_package_manager:
    description: 'The package manager resolved and used'
    value: ${{ steps.detect.outputs.package_manager }}
  resolved_dist_dir:
    description: 'The resolved output directory containing build assets'
    value: ${{ steps.stage_dist.outputs.dist_dir }}

runs:
  using: 'composite'
  steps:
    - name: Detect project environment & package manager
      id: detect
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        REQ_MGR="${{ inputs.package_manager }}"
        RESOLVED_MGR="npm"
        CACHE_TYPE=""
        LOCKFILE_PATH=""

        if [ "$REQ_MGR" = "none" ] || [ "$REQ_MGR" = "static" ]; then
          RESOLVED_MGR="none"
        elif [ "$REQ_MGR" != "auto" ] && [ -n "$REQ_MGR" ]; then
          RESOLVED_MGR="$REQ_MGR"
          case "$RESOLVED_MGR" in
            pnpm) CACHE_TYPE="pnpm"; LOCKFILE_PATH="${{ inputs.working_directory }}/pnpm-lock.yaml" ;;
            yarn) CACHE_TYPE="yarn"; LOCKFILE_PATH="${{ inputs.working_directory }}/yarn.lock" ;;
            bun)  CACHE_TYPE=""; LOCKFILE_PATH="${{ inputs.working_directory }}/bun.lockb" ;;
            *)    CACHE_TYPE="npm"; LOCKFILE_PATH="${{ inputs.working_directory }}/package-lock.json" ;;
          esac
        else
          # Auto-detection mode: inspect lockfiles and package.json
          if [ -f "pnpm-lock.yaml" ]; then
            RESOLVED_MGR="pnpm"
            CACHE_TYPE="pnpm"
            LOCKFILE_PATH="${{ inputs.working_directory }}/pnpm-lock.yaml"
          elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
            RESOLVED_MGR="bun"
            CACHE_TYPE=""
            LOCKFILE_PATH="${{ inputs.working_directory }}/bun.lockb"
          elif [ -f "yarn.lock" ]; then
            RESOLVED_MGR="yarn"
            CACHE_TYPE="yarn"
            LOCKFILE_PATH="${{ inputs.working_directory }}/yarn.lock"
          elif [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ]; then
            RESOLVED_MGR="npm"
            CACHE_TYPE="npm"
            LOCKFILE_PATH="${{ inputs.working_directory }}/package-lock.json"
          elif [ ! -f "package.json" ]; then
            RESOLVED_MGR="none"
          else
            RESOLVED_MGR="npm"
          fi
        fi

        {
          echo "package_manager=${RESOLVED_MGR}"
          echo "cache_type=${CACHE_TYPE}"
          echo "lockfile_path=${LOCKFILE_PATH}"
        } >> "$GITHUB_OUTPUT"
        echo "Resolved Package Manager: $RESOLVED_MGR"

    - name: Setup pnpm (if requested)
      if: steps.detect.outputs.package_manager == 'pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: latest

    - name: Setup Bun (if requested)
      if: steps.detect.outputs.package_manager == 'bun'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Node.js
      if: steps.detect.outputs.package_manager != 'none' && steps.detect.outputs.package_manager != 'static'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version != 'auto' && inputs.node_version || '' }}
        node-version-file: ${{ (inputs.node_version == 'auto' || inputs.node_version == '') && (hashFiles(format('{0}/.nvmrc', inputs.working_directory), format('{0}/.node-version', inputs.working_directory)) != '' && (hashFiles(format('{0}/.nvmrc', inputs.working_directory)) != '' && format('{0}/.nvmrc', inputs.working_directory) || format('{0}/.node-version', inputs.working_directory)) || '') || '' }}
        cache: ${{ steps.detect.outputs.cache_type }}
        cache-dependency-path: ${{ steps.detect.outputs.lockfile_path }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        INSTALL_CMD="${{ inputs.install_command }}"
        PKG_MGR="${{ steps.detect.outputs.package_manager }}"

        if [ "$INSTALL_CMD" = "none" ] || [ "$INSTALL_CMD" = "false" ] || [ "$INSTALL_CMD" = "skip" ] || [ "$PKG_MGR" = "none" ] || [ "$PKG_MGR" = "static" ]; then
          echo "Dependency installation skipped explicitly or no package manager required."
        elif [ -n "$INSTALL_CMD" ]; then
          echo "Running custom install command: $INSTALL_CMD"
          eval "$INSTALL_CMD"
        elif [ ! -f "package.json" ]; then
          echo "No package.json detected. Zero-dependency static project identified — skipping dependency installation."
        else
          case "$PKG_MGR" in
            pnpm)
              echo "Installing dependencies with pnpm..."
              if [ -f "pnpm-lock.yaml" ]; then
                pnpm install --frozen-lockfile
              else
                pnpm install
              fi
              ;;
            bun)
              echo "Installing dependencies with bun..."
              if [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
                bun install --frozen-lockfile
              else
                bun install
              fi
              ;;
            yarn)
              echo "Installing dependencies with yarn..."
              if [ -f "yarn.lock" ]; then
                yarn install --frozen-lockfile
              else
                yarn install
              fi
              ;;
            *)
              echo "Installing dependencies with npm..."
              if [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ]; then
                npm ci
              else
                npm install
              fi
              ;;
          esac
        fi

    - name: Run Diagnostics / Checks
      if: inputs.check_command != ''
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "Running diagnostics check: ${{ inputs.check_command }}"
        ${{ inputs.check_command }}

    - name: Build static site export
      id: build
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        BUILD_START=$(date +%s)
        BUILD_CMD="${{ inputs.build_command }}"
        PKG_MGR="${{ steps.detect.outputs.package_manager }}"

        if [ "$BUILD_CMD" = "none" ] || [ "$BUILD_CMD" = "false" ] || [ "$BUILD_CMD" = "skip" ] || [ -z "$BUILD_CMD" ]; then
          echo "Static project detected: build step skipped."
        elif [ "$BUILD_CMD" = "npm run build" ] || [ "$BUILD_CMD" = "auto" ]; then
          if [ ! -f "package.json" ]; then
            echo "No package.json detected with default build command. Skipping build step for static project."
          elif ! node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.build ? 0 : 1)" 2>/dev/null; then
            echo "No 'build' script found in package.json. Skipping build step."
          else
            case "$PKG_MGR" in
              pnpm) echo "Running build: pnpm run build"; pnpm run build ;;
              bun)  echo "Running build: bun run build"; bun run build ;;
              yarn) echo "Running build: yarn build"; yarn build ;;
              *)    echo "Running build: npm run build"; npm run build ;;
            esac
          fi
        else
          echo "Running custom build command: $BUILD_CMD"
          eval "$BUILD_CMD"
        fi

        BUILD_END=$(date +%s)
        BUILD_DURATION=$((BUILD_END - BUILD_START))
        echo "duration=${BUILD_DURATION}s" >> "$GITHUB_OUTPUT"

    - name: Stage & Resolve static output directory
      id: stage_dist
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        REPO_NAME: ${{ github.repository }}
      run: |
        REQ_DIR="${{ inputs.dist_dir }}"
        FINAL_DIR="$REQ_DIR"

        if [ "$REQ_DIR" = "auto" ] || [ ! -d "$REQ_DIR" ] || [ -z "$(ls -A "$REQ_DIR" 2>/dev/null)" ]; then
          # Search for standard static framework output directories
          if [ -d "dist" ] && [ "$(ls -A dist 2>/dev/null)" ]; then
            FINAL_DIR="dist"
          elif [ -d "out" ] && [ "$(ls -A out 2>/dev/null)" ]; then
            FINAL_DIR="out"
          elif [ -d "build" ] && [ "$(ls -A build 2>/dev/null)" ]; then
            FINAL_DIR="build"
          elif [ -d ".output/public" ] && [ "$(ls -A .output/public 2>/dev/null)" ]; then
            FINAL_DIR=".output/public"
          elif [ -d "_site" ] && [ "$(ls -A _site 2>/dev/null)" ]; then
            FINAL_DIR="_site"
          elif [ -d "site" ] && [ "$(ls -A site 2>/dev/null)" ]; then
            FINAL_DIR="site"
          elif [ -d "public" ] && [ "$(ls -A public 2>/dev/null)" ]; then
            echo "Auto-staging static files from 'public/' into 'dist/'..."
            mkdir -p dist
            cp -r public/* dist/ 2>/dev/null || cp -r public/. dist/
            FINAL_DIR="dist"
          elif [ -f "index.html" ]; then
            echo "Auto-staging static root files into 'dist/'..."
            mkdir -p dist
            find . -maxdepth 1 ! -name '.' ! -name 'dist' ! -name '.git' ! -name '.github' ! -name '.vercel' ! -name 'node_modules' ! -name '.lighthouseci' -exec cp -r {} dist/ \;
            FINAL_DIR="dist"
          else
            FINAL_DIR="dist"
          fi
        fi

        # Bootstrap Fallback: If output directory does not exist, is empty, or lacks index.html
        IS_BOOTSTRAP="false"
        if [ ! -d "$FINAL_DIR" ] || [ -z "$(ls -A "$FINAL_DIR" 2>/dev/null)" ] || [ ! -f "$FINAL_DIR/index.html" ]; then
          echo "No deployable index.html or build artifacts found in '$FINAL_DIR'."
          echo "Generating automatic Lighthouse-compliant bootstrap fallback..."
          FINAL_DIR="dist"
          mkdir -p "$FINAL_DIR"

          DISP_PROJECT="${REPO_NAME#*/}"
          DISP_BRANCH="${BRANCH_NAME:-main}"

          cat << HTML_EOF > "${FINAL_DIR}/index.html"
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>${DISP_PROJECT} — Deployment Active</title>
          <meta name="description" content="This project is successfully connected to the LABEIM automated CI/CD pipeline and Cloudflare Pages. Deployment is active and ready for development.">
          <meta name="robots" content="index, follow">
          <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
          <style>
          *, *::before, *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          }
          :root {
          --bg: #090d16;
          --card-bg: #111a2e;
          --card-border: #1e293b;
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
          --accent: #38bdf8;
          --accent-glow: rgba(56, 189, 248, 0.15);
          --success: #22c55e;
          --success-bg: rgba(34, 197, 94, 0.12);
          --success-border: rgba(34, 197, 94, 0.3);
          }
          body {
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
          background-color: var(--bg);
          background-image: 
          radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
          radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
          color: var(--text-main);
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 24px 16px;
          line-height: 1.6;
          }
          .container {
          width: 100%;
          max-width: 640px;
          }
          .card {
          background: var(--card-bg);
          border: 1px solid var(--card-border);
          border-radius: 16px;
          padding: 36px 32px;
          box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 50px -10px var(--accent-glow);
          }
          .badge {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 6px 14px;
          border-radius: 9999px;
          background: var(--success-bg);
          border: 1px solid var(--success-border);
          color: var(--success);
          font-size: 13px;
          font-weight: 600;
          margin-bottom: 20px;
          letter-spacing: 0.02em;
          }
          .badge-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background-color: var(--success);
          box-shadow: 0 0 8px var(--success);
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
          }
          @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.4; transform: scale(0.85); }
          }
          h1 {
          font-size: 28px;
          font-weight: 700;
          letter-spacing: -0.02em;
          margin-bottom: 12px;
          background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 50%, #94a3b8 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          }
          .subtitle {
          color: var(--text-muted);
          font-size: 15px;
          margin-bottom: 28px;
          }
          .info-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px;
          margin-bottom: 28px;
          }
          @media (max-width: 480px) {
          .info-grid { grid-template-columns: 1fr; }
          .card { padding: 24px 20px; }
          h1 { font-size: 24px; }
          }
          .info-item {
          background: rgba(15, 23, 42, 0.6);
          border: 1px solid var(--card-border);
          border-radius: 10px;
          padding: 12px 16px;
          }
          .info-label {
          font-size: 12px;
          color: var(--text-muted);
          text-transform: uppercase;
          letter-spacing: 0.05em;
          margin-bottom: 4px;
          }
          .info-value {
          font-size: 14px;
          font-weight: 600;
          color: var(--text-main);
          word-break: break-all;
          }
          .steps-section {
          border-top: 1px solid var(--card-border);
          padding-top: 24px;
          }
          .steps-title {
          font-size: 14px;
          font-weight: 600;
          color: var(--accent);
          margin-bottom: 14px;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          }
          .steps-list {
          list-style: none;
          display: flex;
          flex-direction: column;
          gap: 10px;
          }
          .steps-list li {
          font-size: 14px;
          color: var(--text-muted);
          display: flex;
          align-items: flex-start;
          gap: 10px;
          }
          .step-number {
          background: rgba(56, 189, 248, 0.15);
          color: var(--accent);
          width: 22px;
          height: 22px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 12px;
          font-weight: 700;
          flex-shrink: 0;
          margin-top: 1px;
          }
          footer {
          margin-top: 24px;
          text-align: center;
          color: var(--text-muted);
          font-size: 13px;
          }
          </style>
          </head>
          <body>
          <main class="container">
          <div class="card">
          <div class="badge">
          <span class="badge-dot"></span>
          <span>Cloudflare Pages &middot; Deployment Active</span>
          </div>
          <h1>${DISP_PROJECT}</h1>
          <p class="subtitle">This repository is live and successfully connected to the LABEIM automated deployment pipeline. Once your frontend code is pushed, this placeholder will automatically update.</p>
                    <div class="info-grid">
          <div class="info-item">
          <div class="info-label">Repository</div>
          <div class="info-value">${REPO_NAME}</div>
          </div>
          <div class="info-item">
          <div class="info-label">Branch</div>
          <div class="info-value">${DISP_BRANCH}</div>
          </div>
          <div class="info-item">
          <div class="info-label">Target Platform</div>
          <div class="info-value">Cloudflare Pages</div>
          </div>
          <div class="info-item">
          <div class="info-label">Pipeline Status</div>
          <div class="info-value">Active &amp; Ready</div>
          </div>
          </div>
                    <div class="steps-section">
          <h2 class="steps-title">Next Steps</h2>
          <ul class="steps-list">
          <li>
          <span class="step-number">1</span>
          <span>Scaffold your frontend application (e.g. Vite, Next.js, Astro, React, or static HTML).</span>
          </li>
          <li>
          <span class="step-number">2</span>
          <span>Commit and push your files to GitHub.</span>
          </li>
          <li>
          <span class="step-number">3</span>
          <span>The pipeline will automatically build and deploy your live web application.</span>
          </li>
          </ul>
          </div>
          </div>
          <footer>
          <p>LABEIM Shared CI/CD Pipeline &middot; Cloudflare Pages Deployment</p>
          </footer>
          </main>
          </body>
          </html>
        HTML_EOF

          cp "${FINAL_DIR}/index.html" "${FINAL_DIR}/404.html"
          echo "/*    /index.html   200" > "${FINAL_DIR}/_redirects"
          cat << 'ROBOTS_EOF' > "${FINAL_DIR}/robots.txt"
          User-agent: *
          Allow: /
        ROBOTS_EOF

          IS_BOOTSTRAP="true"
          echo "Bootstrap fallback successfully created in '${FINAL_DIR}'."
        fi

        echo "Resolved output directory: $FINAL_DIR"
        echo "dist_dir=${FINAL_DIR}" >> "$GITHUB_OUTPUT"
        echo "is_bootstrap=${IS_BOOTSTRAP}" >> "$GITHUB_OUTPUT"

    - name: Generate build artifact hash
      id: hash
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        TARGET_DIR="${{ steps.stage_dist.outputs.dist_dir }}"
        if [ -d "$TARGET_DIR" ]; then
          if [ "$TARGET_DIR" = "." ] || [ "$TARGET_DIR" = "./" ]; then
            HASH=$(find . -type f ! -path '*/.git/*' ! -path '*/.github/*' ! -path '*/node_modules/*' ! -path '*/.vercel/*' ! -path '*/.lighthouseci/*' -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
          else
            HASH=$(find "$TARGET_DIR" -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
          fi
          echo "sha256=${HASH}" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Output directory '$TARGET_DIR' not found after build."
          echo "sha256=none" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload build artifact
      if: inputs.upload_artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.working_directory == '.' && format('{0}/', steps.stage_dist.outputs.dist_dir) || format('{0}/{1}/', inputs.working_directory, steps.stage_dist.outputs.dist_dir) }}
        retention-days: ${{ inputs.artifact_retention_days }}

    - name: Build summary
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        BRANCH_NAME: ${{ github.ref_name }}
        COMMIT_SHA: ${{ github.sha }}
        IS_BOOTSTRAP: ${{ steps.stage_dist.outputs.is_bootstrap }}
      run: |
        TARGET_DIR="${{ steps.stage_dist.outputs.dist_dir }}"
        DIR_SIZE="N/A"
        if [ -d "$TARGET_DIR" ]; then
          DIR_SIZE=$(du -sh "$TARGET_DIR" | cut -f1)
        fi
        HASH="${{ steps.hash.outputs.sha256 }}"

        {
          echo "### Build Summary"
          echo ""
          echo "| Metric | Value |"
          echo "| :--- | :--- |"
          echo "| Package Manager | \`${{ steps.detect.outputs.package_manager }}\` |"
          echo "| Output Directory | \`${TARGET_DIR}\` |"
          if [ "$IS_BOOTSTRAP" = "true" ]; then
            echo "| Deployment Type | **Bootstrap Fallback (Initial Commit)** |"
          else
            echo "| Deployment Type | Application Static Build |"
          fi
          echo "| Build Duration | ${{ steps.build.outputs.duration }} |"
          echo "| Artifact SHA256 | \`${HASH:0:16}...\` |"
          echo "| Artifact Size | ${DIR_SIZE} |"
          echo "| Branch | \`${BRANCH_NAME}\` |"
          echo "| Commit | \`${COMMIT_SHA}\` |"
        } >> "$GITHUB_STEP_SUMMARY"
