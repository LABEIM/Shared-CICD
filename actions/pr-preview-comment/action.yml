name: 'Post PR Preview Comment'
description: 'Posts or updates a GitHub PR comment with live preview deployment links for active platforms'

inputs:
  cloudflare_url:
    description: 'Cloudflare Pages preview URL'
    required: false
    default: ''
  vercel_url:
    description: 'Vercel preview URL'
    required: false
    default: ''
  custom_message:
    description: 'Optional custom message to include in comment'
    required: false
    default: ''
  github_token:
    description: 'GitHub token with pull-requests: write permission'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Build comment markdown body
      id: build_body
      shell: bash
      env:
        CF_URL: ${{ inputs.cloudflare_url }}
        VERCEL_URL: ${{ inputs.vercel_url }}
        CUSTOM_MSG: ${{ inputs.custom_message }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        CF_CLEAN=$(echo "$CF_URL" | tr -cd 'a-zA-Z0-9.:/_-')
        VERCEL_CLEAN=$(echo "$VERCEL_URL" | tr -cd 'a-zA-Z0-9.:/_-')

        {
          echo "body<<COMMENT_EOF"
          echo "<!-- shared-ci-cd:pr-preview -->"
          echo "### Preview Deployments Ready"
          echo ""
          if [ -n "$CUSTOM_MSG" ]; then
            echo "$CUSTOM_MSG"
            echo ""
          fi

          echo "| Platform | Preview URL | Status |"
          echo "| :--- | :--- | :---: |"

          if [ -n "$CF_CLEAN" ]; then
            echo "| **Cloudflare Pages** | [$CF_CLEAN]($CF_CLEAN) | Live |"
          fi

          if [ -n "$VERCEL_CLEAN" ]; then
            echo "| **Vercel** | [$VERCEL_CLEAN]($VERCEL_CLEAN) | Live |"
          fi

          if [ -z "$CF_CLEAN" ] && [ -z "$VERCEL_CLEAN" ]; then
            echo "| *No preview URLs captured* | - | Pending |"
          fi

          echo ""
          echo "---"
          echo "*Commit: \`${HEAD_SHA}\` · Workflow: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
          echo "COMMENT_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Find existing preview comment
      id: find_comment
      continue-on-error: true
      uses: peter-evans/find-comment@v4
      with:
        token: ${{ inputs.github_token }}
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: '<!-- shared-ci-cd:pr-preview -->'

    - name: Create or update PR comment
      id: post_comment
      continue-on-error: true
      uses: peter-evans/create-or-update-comment@v5
      with:
        token: ${{ inputs.github_token }}
        comment-id: ${{ steps.find_comment.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        body: ${{ steps.build_body.outputs.body }}
        edit-mode: replace
