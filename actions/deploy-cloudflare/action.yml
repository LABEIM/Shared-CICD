name: 'Deploy to Cloudflare Pages'
description: 'Deploys static assets to Cloudflare Pages via Wrangler with exponential retry and deterministic URL resolution, or triggers remote Cloudflare Pages builds via Deploy Hooks'

inputs:
  working_directory:
    description: 'Working directory for projects in monorepos or subdirectories'
    required: false
    default: '.'
  project_name:
    description: 'Cloudflare Pages project name'
    required: true
  dist_dir:
    description: 'Directory containing built assets to deploy'
    required: false
    default: 'dist'
  production_branch:
    description: 'Primary production branch name'
    required: false
    default: 'main'
  api_token:
    description: 'Cloudflare API Token with Pages edit permissions (required for Wrangler direct deploy)'
    required: false
    default: ''
  account_id:
    description: 'Cloudflare Account ID (required for Wrangler direct deploy)'
    required: false
    default: ''
  deploy_hook_url:
    description: 'Optional Cloudflare Pages Deploy Hook URL to trigger remote Cloudflare build'
    required: false
    default: ''
  max_retries:
    description: 'Maximum number of deployment retry attempts'
    required: false
    default: '3'
  retry_delay:
    description: 'Initial retry backoff delay in seconds'
    required: false
    default: '10'

outputs:
  deploy_url:
    description: 'The resolved live or branch preview deployment URL'
    value: ${{ steps.deploy.outputs.deploy_url }}
  is_production:
    description: 'Whether this was a production or preview deployment'
    value: ${{ steps.deploy.outputs.is_production }}

runs:
  using: 'composite'
  steps:
    - name: Deploy to Cloudflare Pages
      id: deploy
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api_token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account_id }}
        DEPLOY_HOOK: ${{ inputs.deploy_hook_url }}
        PROJECT_NAME: ${{ inputs.project_name }}
        DIST_DIR: ${{ inputs.dist_dir }}
        PROD_BRANCH: ${{ inputs.production_branch }}
        MAX_RETRIES: ${{ inputs.max_retries }}
        INITIAL_RETRY_DELAY: ${{ inputs.retry_delay }}
        RAW_HEAD_REF: ${{ github.head_ref }}
        RAW_REF_NAME: ${{ github.ref_name }}
      run: |
        BRANCH_NAME="${RAW_HEAD_REF:-$RAW_REF_NAME}"
        CLEAN_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/^-//; s/-$//')
        IS_PROD="false"
        if [ "$BRANCH_NAME" = "$PROD_BRANCH" ] || [ "$CLEAN_BRANCH" = "main" ] || [ "$CLEAN_BRANCH" = "master" ]; then
          IS_PROD="true"
        fi

        echo "Target Cloudflare Project: $PROJECT_NAME"
        echo "Target Branch: $BRANCH_NAME"

        if [ -n "$DEPLOY_HOOK" ]; then
          echo "Triggering remote Cloudflare Pages build via Deploy Hook..."
          HOOK_RESP=$(curl -s -X POST -w "\n%{http_code}" "$DEPLOY_HOOK")
          HTTP_CODE=$(echo "$HOOK_RESP" | tail -n1)
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Cloudflare Deploy Hook triggered successfully (HTTP $HTTP_CODE)."
          else
            echo "::error::Failed to trigger Cloudflare Deploy Hook (HTTP $HTTP_CODE): $HOOK_RESP"
            exit 1
          fi

          if [ "$IS_PROD" = "true" ]; then
            DEPLOY_URL="https://${PROJECT_NAME}.pages.dev"
          else
            DEPLOY_URL="https://${CLEAN_BRANCH}.${PROJECT_NAME}.pages.dev"
          fi
        else
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Either deploy_hook_url OR both api_token and account_id must be provided for Cloudflare Pages deployment."
            exit 1
          fi

          echo "Source Assets Directory: $DIST_DIR"

          # Auto-bootstrap fallback if DIST_DIR is missing, empty, or lacks index.html
          if [ ! -d "$DIST_DIR" ] || [ -z "$(ls -A "$DIST_DIR" 2>/dev/null)" ] || [ ! -f "$DIST_DIR/index.html" ]; then
            echo "No deployable HTML found in '$DIST_DIR'. Bootstrapping fallback placeholder..."
            mkdir -p "$DIST_DIR"

            cat << HTML_EOF > "${DIST_DIR}/index.html"
            <!DOCTYPE html>
            <html lang="en">
            <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${CLEAN_BRANCH} — Deployment Active</title>
            <meta name="description" content="This project is successfully connected to the LABEIM automated CI/CD pipeline and Cloudflare Pages. Deployment is active and ready for development.">
            <meta name="robots" content="index, follow">
            <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
            <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            :root {
            --bg: #090d16;
            --card-bg: #111a2e;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.12);
            --success-border: rgba(34, 197, 94, 0.3);
            }
            body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            background-image: 
            radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
            radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            line-height: 1.6;
            }
            .container { width: 100%; max-width: 640px; }
            .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 50px -10px var(--accent-glow);
            }
            .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.02em;
            }
            .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
            @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            }
            h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 50%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            }
            .subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 28px; }
            .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
            }
            @media (max-width: 480px) {
            .info-grid { grid-template-columns: 1fr; }
            .card { padding: 24px 20px; }
            h1 { font-size: 24px; }
            }
            .info-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 16px;
            }
            .info-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
            }
            .info-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-all;
            }
            .steps-section { border-top: 1px solid var(--card-border); padding-top: 24px; }
            .steps-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            }
            .steps-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
            .steps-list li {
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            }
            .step-number {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
            }
            footer { margin-top: 24px; text-align: center; color: var(--text-muted); font-size: 13px; }
            </style>
            </head>
            <body>
            <main class="container">
            <div class="card">
            <div class="badge">
            <span class="badge-dot"></span>
            <span>Cloudflare Pages &middot; Deployment Active</span>
            </div>
            <h1>${PROJECT_NAME}</h1>
            <p class="subtitle">This repository is live and successfully connected to the LABEIM automated deployment pipeline. Once your frontend code is pushed, this placeholder will automatically update.</p>
                        <div class="info-grid">
            <div class="info-item">
            <div class="info-label">Project</div>
            <div class="info-value">${PROJECT_NAME}</div>
            </div>
            <div class="info-item">
            <div class="info-label">Branch</div>
            <div class="info-value">${BRANCH_NAME}</div>
            </div>
            <div class="info-item">
            <div class="info-label">Target Platform</div>
            <div class="info-value">Cloudflare Pages</div>
            </div>
            <div class="info-item">
            <div class="info-label">Pipeline Status</div>
            <div class="info-value">Active &amp; Ready</div>
            </div>
            </div>
                        <div class="steps-section">
            <h2 class="steps-title">Next Steps</h2>
            <ul class="steps-list">
            <li>
            <span class="step-number">1</span>
            <span>Scaffold your frontend application (e.g. Vite, Next.js, Astro, React, or static HTML).</span>
            </li>
            <li>
            <span class="step-number">2</span>
            <span>Commit and push your files to GitHub.</span>
            </li>
            <li>
            <span class="step-number">3</span>
            <span>The pipeline will automatically build and deploy your live web application.</span>
            </li>
            </ul>
            </div>
            </div>
            <footer>
            <p>LABEIM Shared CI/CD Pipeline &middot; Cloudflare Pages Deployment</p>
            </footer>
            </main>
            </body>
            </html>
          HTML_EOF

            cp "${DIST_DIR}/index.html" "${DIST_DIR}/404.html"
            echo "/*    /index.html   200" > "${DIST_DIR}/_redirects"
            cat << 'ROBOTS_EOF' > "${DIST_DIR}/robots.txt"
            User-agent: *
            Allow: /
          ROBOTS_EOF
          fi

          # Auto-create Pages project shell if it does not exist yet
          npx --yes wrangler pages project create "$PROJECT_NAME" --production-branch="$PROD_BRANCH" > /dev/null 2>&1 || true

          # Deploy with retry logic (exponential backoff)
          RETRY_DELAY=$INITIAL_RETRY_DELAY
          for ATTEMPT in $(seq 1 $MAX_RETRIES); do
            echo "::group::Cloudflare Pages deployment attempt $ATTEMPT/$MAX_RETRIES"
            if npx --yes wrangler pages deploy "$DIST_DIR" \
              --project-name="$PROJECT_NAME" \
              --branch="$BRANCH_NAME" \
              --commit-dirty=true 2>&1 | tee cf_deploy.log; then
              echo "::endgroup::"
              echo "Deployment succeeded on attempt $ATTEMPT"
              break
            fi
            echo "::endgroup::"
            if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
              echo "Attempt $ATTEMPT failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            else
              echo "::error::All $MAX_RETRIES deployment attempts to Cloudflare Pages failed."
              exit 1
            fi
          done

          # Parse wrangler deploy output for canonical Production URL or Branch Preview URL
          PROD_URL=$(grep -i "Production URL:" cf_deploy.log | grep -oP 'https://[a-zA-Z0-9.-]+\.pages\.dev' | head -1 | tr -cd 'a-zA-Z0-9.:/_-' || true)
          BRANCH_PREVIEW_URL=$(grep -i "Branch Preview URL:" cf_deploy.log | grep -oP 'https://[a-zA-Z0-9.-]+\.pages\.dev' | head -1 | tr -cd 'a-zA-Z0-9.:/_-' || true)

          DEPLOY_URL=""
          if [ "$IS_PROD" = "true" ]; then
            if [ -n "$PROD_URL" ]; then
              DEPLOY_URL="$PROD_URL"
            else
              DEPLOY_URL="https://${PROJECT_NAME}.pages.dev"
            fi
          else
            if [ -n "$BRANCH_PREVIEW_URL" ]; then
              DEPLOY_URL="$BRANCH_PREVIEW_URL"
            fi
          fi

          # Fallback 1: look for general pages.dev/workers.dev URL in logs
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL=$(sed 's/\x1B\[[0-9;]*[a-zA-Z]//g' cf_deploy.log \
              | grep -oP 'https://[a-zA-Z0-9.-]+\.(pages\.dev|workers\.dev)' \
              | grep -iv 'dash\.cloudflare\|api\.cloudflare' \
              | head -1 \
              | tr -cd 'a-zA-Z0-9.:/_-' || true)
          fi

          # Fallback 2: construct standard Cloudflare Pages URL pattern
          if [ -z "$DEPLOY_URL" ] || ! echo "$DEPLOY_URL" | grep -q '^https://'; then
            if [ "$IS_PROD" = "true" ]; then
              DEPLOY_URL="https://${PROJECT_NAME}.pages.dev"
            else
              DEPLOY_URL="https://${CLEAN_BRANCH}.${PROJECT_NAME}.pages.dev"
            fi
          fi
        fi

        echo "Live deployment URL: $DEPLOY_URL"
        {
          echo "deploy_url=$DEPLOY_URL"
          echo "is_production=$IS_PROD"
        } >> "$GITHUB_OUTPUT"

    - name: Record Cloudflare deployment summary
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        DEPLOY_HOOK: ${{ inputs.deploy_hook_url }}
      run: |
        BUILD_TYPE="Direct Upload (Wrangler)"
        if [ -n "$DEPLOY_HOOK" ]; then
          BUILD_TYPE="Remote (Cloudflare Pages Build Runner)"
        fi
        {
          echo "### Cloudflare Pages Deployment"
          echo ""
          echo "| Detail | Value |"
          echo "| :--- | :--- |"
          echo "| URL | ${{ steps.deploy.outputs.deploy_url }} |"
          echo "| Branch | \`${TARGET_BRANCH}\` |"
          echo "| Build Mode | ${BUILD_TYPE} |"
          echo "| Mode | ${{ steps.deploy.outputs.is_production == 'true' && 'Production' || 'Branch Preview' }} |"
          echo "| Status | Deployed |"
        } >> "$GITHUB_STEP_SUMMARY"
